<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marquesina — tu videoteca personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14161f;
    --bg-raised: #1c1f2b;
    --surface: #1e212d;
    --surface-2: #262a38;
    --border: #343a4d;
    --text: #edeae3;
    --text-dim: #a6a9b8;
    --amber: #e8a33d;
    --amber-dim: #a9772c;
    --teal: #4e8b8b;
    --danger: #c24a4a;
    --radius-card: 6px;
    --radius-pill: 999px;
    font-size: 16px;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(232,163,61,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(78,139,139,0.07), transparent 55%);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  h1,h2,h3, .display{
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  button{ font-family: inherit; }
  a{ color: inherit; }

  ::selection{ background: var(--amber); color: #1a1a1a; }

  /* focus visibility */
  :focus-visible{
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ---------- topbar ---------- */
  .topbar{
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 20px;
    padding: 18px 32px;
    background: rgba(20,22,31,0.88);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand{
    display:flex; align-items: baseline; gap: 8px;
    white-space: nowrap;
  }
  .brand .mark{
    font-family:'Fraunces', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--amber);
  }
  .brand .tag{
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .search-wrap{
    flex: 1;
    max-width: 420px;
  }
  .search-wrap input{
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 14px;
    border-radius: var(--radius-pill);
    font-size: 0.92rem;
  }
  .search-wrap input::placeholder{ color: var(--text-dim); }
  .topbar-actions{
    display:flex; gap: 10px; margin-left: auto;
    flex-wrap: wrap;
  }

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    border-radius: var(--radius-pill);
    padding: 9px 16px;
    font-size: 0.86rem;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .btn:hover{ border-color: #4a5169; background: var(--surface-2); }
  .btn-primary{
    background: var(--amber);
    color: #1a1408;
    border-color: var(--amber);
  }
  .btn-primary:hover{ background: #f0af4f; border-color:#f0af4f; }
  .btn-ghost{ background: transparent; }
  .btn-danger{ border-color: rgba(194,74,74,0.5); color:#e79a9a; background: transparent; }
  .btn-danger:hover{ background: rgba(194,74,74,0.12); border-color: var(--danger); }
  .btn-sm{ padding: 6px 12px; font-size: 0.78rem; }
  .icon{ width: 15px; height: 15px; flex-shrink:0; }

  /* ---------- layout ---------- */
  main{ padding: 32px; max-width: 1400px; margin: 0 auto; }
  .section-head{
    display:flex; align-items:baseline; justify-content: space-between;
    margin-bottom: 18px;
  }
  .section-head h1{ font-size: 1.5rem; margin:0; }
  .count-pill{
    font-size: 0.78rem; color: var(--text-dim);
    font-family: 'Inter', sans-serif; font-weight: 500;
  }

  .empty-state{
    border: 1px dashed var(--border);
    border-radius: var(--radius-card);
    padding: 64px 24px;
    text-align:center;
    color: var(--text-dim);
  }
  .empty-state .display{ color: var(--text); font-size: 1.3rem; margin-bottom:8px; }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 20px;
  }

  .card{
    position: relative;
    border-radius: var(--radius-card);
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: border-color .15s ease, transform .15s ease;
  }
  .card:hover{ border-color: var(--amber-dim); }
  .card.is-open{ border-color: var(--amber); }
  .poster{
    aspect-ratio: 2/3;
    width: 100%;
    background-size: cover;
    background-position: center;
    display:flex; align-items:flex-end;
    position: relative;
  }
  .poster::after{
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(180deg, transparent 40%, rgba(10,11,16,0.92) 100%);
  }
  .poster .fallback-title{
    position:relative; z-index:1;
    font-family:'Fraunces', serif;
    font-size: 1.6rem;
    line-height: 1.05;
    padding: 14px;
    color: var(--text);
    z-index: 2;
  }
  .card-meta{
    position: relative; z-index: 2;
    padding: 10px 12px 12px;
    margin-top: -46px;
  }
  .card-title{
    font-family:'Fraunces', serif;
    font-size: 1.02rem;
    font-weight: 600;
    line-height:1.2;
    margin: 0 0 4px;
    color: var(--text);
  }
  .card-sub{
    font-size: 0.74rem;
    color: var(--text-dim);
    display:flex; align-items:center; gap:6px;
  }
  .badge{
    display:inline-block;
    font-size: 0.66rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: var(--radius-pill);
    letter-spacing: 0.02em;
  }
  .badge-series{ background: rgba(78,139,139,0.22); color:#9fd6d6; }
  .badge-movie{ background: rgba(232,163,61,0.2); color: var(--amber); }

  /* ---------- expanded panel ---------- */
  .expand-panel{
    grid-column: 1 / -1;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 22px 26px 26px;
    margin-top: -4px;
    animation: reveal .18s ease-out;
  }
  @keyframes reveal{ from{ opacity:0; transform: translateY(-6px);} to{opacity:1; transform:none;} }

  .expand-head{
    display:flex; justify-content: space-between; align-items:flex-start;
    gap: 20px;
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .expand-head h2{ margin: 0 0 4px; font-size: 1.3rem; }
  .expand-head-actions{ display:flex; gap:8px; flex-shrink:0; }

  .filmstrip{
    display:flex; flex-direction: column;
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    overflow: hidden;
  }
  .season-row{
    display:flex; align-items:center; gap: 10px;
    padding: 10px 14px;
    background: var(--surface-2);
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }
  .sprocket{
    width:8px; height:8px; border-radius:50%;
    background: var(--border);
    flex-shrink:0;
  }
  .episode-row{
    display:flex; align-items:center; gap: 14px;
    padding: 11px 14px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  .episode-row:hover{ background: var(--surface-2); }
  .ep-num{
    font-family:'Fraunces', serif;
    font-size: 0.95rem;
    color: var(--amber);
    width: 30px;
    flex-shrink:0;
  }
  .ep-title{ flex:1; font-size: 0.88rem; }
  .ep-actions{ display:flex; gap:6px; flex-shrink:0; }

  .icon-btn{
    width: 30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor:pointer;
  }
  .icon-btn:hover{ color: var(--text); border-color: #4a5169; }
  .icon-btn.play{ color: var(--amber); border-color: rgba(232,163,61,0.4); }
  .icon-btn.play:hover{ background: rgba(232,163,61,0.15); }
  .icon-btn.danger:hover{ color:#e79a9a; border-color: var(--danger); background: rgba(194,74,74,0.1); }

  .add-episode-row{
    padding: 12px 14px;
    border-top: 1px solid var(--border);
  }

  /* ---------- modal ---------- */
  .modal-overlay{
    position: fixed; inset:0;
    background: rgba(10,11,16,0.7);
    backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center;
    z-index: 100;
    padding: 20px;
  }
  .modal{
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 100%; max-width: 460px;
    padding: 26px;
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal h2{ margin: 0 0 18px; font-size: 1.25rem; }
  .field{ margin-bottom: 14px; }
  .field label{
    display:block; font-size: 0.78rem; font-weight:600;
    color: var(--text-dim); margin-bottom: 6px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  .field textarea{ resize: vertical; min-height: 60px; }
  .field-row{ display:flex; gap: 12px; }
  .field-row .field{ flex:1; }
  .modal-actions{
    display:flex; justify-content:flex-end; gap: 10px; margin-top: 20px;
  }
  .hint{ font-size: 0.74rem; color: var(--text-dim); margin-top: 4px; }

  /* ---------- player modal ---------- */
  .player-overlay{
    position: fixed; inset:0;
    background: #050608;
    z-index: 200;
    display:flex; flex-direction:column;
  }
  .player-top{
    display:flex; align-items:center; justify-content: space-between;
    padding: 14px 20px;
    color: var(--text-dim);
    font-size: 0.85rem;
  }
  .player-top .now{ color: var(--text); font-family:'Fraunces', serif; font-size: 1.05rem; }
  .player-body{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding: 0 20px 20px;
  }
  video{ max-width: 100%; max-height: 100%; width:100%; background:#000; border-radius: 6px; }
  .player-status{
    text-align:center; color: var(--text-dim); font-size: 0.85rem;
  }
  .progress-track{
    width: 260px; height:4px; background: var(--surface-2);
    border-radius: 2px; margin: 12px auto 0; overflow:hidden;
  }
  .progress-fill{ height:100%; background: var(--amber); width:0%; transition: width .3s ease; }

  .player-top-actions{ display:flex; align-items:center; gap:10px; }
  .player-tag{
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: var(--radius-pill);
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .player-tag.http{ border-color: rgba(78,139,139,0.5); color: #9fd6d6; }
  .player-tag.webtorrent{ border-color: rgba(232,163,61,0.5); color: var(--amber); }

  .player-error-box{
    text-align: center;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 30px 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .player-btn-group{ display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

  /* Subtítulos personalizados (WebVTT) */
  video::cue {
    background: rgba(10, 11, 16, 0.85);
    color: #ffffff;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 1.15rem;
    font-weight: 500;
    line-height: 1.4;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }

  .player-drop-hint{
    position: absolute;
    inset: 0;
    background: rgba(20, 22, 31, 0.88);
    border: 3px dashed var(--amber);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--amber);
    z-index: 250;
    pointer-events: none;
  }
  .player-overlay.dragover .player-drop-hint{
    display: flex;
  }

  .toast{
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 12px 20px; border-radius: var(--radius-pill);
    font-size: 0.85rem; z-index: 300;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .toast.error{ border-color: var(--danger); color: #f0b3b3; }

  input[type="file"]{ display:none; }

  @media (max-width: 640px){
    .topbar{ flex-wrap: wrap; padding: 14px 16px; }
    .search-wrap{ order: 3; max-width: none; width:100%; }
    main{ padding: 20px 16px; }
    .grid{ grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap:14px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="mark">Marquesina</span>
    <span class="tag">tu videoteca personal</span>
  </div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Buscar título…" autocomplete="off">
  </div>
  <div class="topbar-actions">
    <button class="btn btn-ghost btn-sm" id="btnImport">Importar JSON</button>
    <button class="btn btn-ghost btn-sm" id="btnExport">Exportar JSON</button>
    <button class="btn btn-primary" id="btnAdd">+ Agregar</button>
  </div>
  <input type="file" id="importFile" accept="application/json">
</div>

<main>
  <div class="section-head">
    <h1>Tu colección</h1>
    <span class="count-pill" id="countPill"></span>
  </div>
  <div id="gridWrap"></div>
</main>

<div id="modalRoot"></div>
<div id="playerRoot"></div>
<div id="toastRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/webtorrent@2.6.6/webtorrent.min.js"></script>
<script>
(function(){
  "use strict";

  /* ============ estado y persistencia ============ */
  const STORAGE_KEY = "marquesina_library_v1";
  let library = loadLibrary();
  let expandedId = null;
  let searchTerm = "";
  let torrentClient = null;
  let activeTorrent = null;

  function loadLibrary(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){
      console.error("No se pudo leer la biblioteca guardada:", e);
      return [];
    }
  }

  function saveLibrary(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(library));
    }catch(e){
      showToast("No se pudo guardar en localStorage (¿espacio lleno?)", true);
    }
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /* ============ toast ============ */
  let toastTimer = null;
  function showToast(msg, isError){
    const root = document.getElementById("toastRoot");
    root.innerHTML = `<div class="toast ${isError ? 'error':''}">${escapeHtml(msg)}</div>`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ root.innerHTML = ""; }, 3200);
  }

  function escapeHtml(str){
    const d = document.createElement("div");
    d.textContent = str == null ? "" : String(str);
    return d.innerHTML;
  }

  /* ============ render principal ============ */
  function render(){
    const gridWrap = document.getElementById("gridWrap");
    const countPill = document.getElementById("countPill");
    const term = searchTerm.trim().toLowerCase();
    const items = library.filter(it => !term || it.title.toLowerCase().includes(term));

    countPill.textContent = library.length
      ? `${library.length} título${library.length === 1 ? '' : 's'}`
      : "";

    if(!library.length){
      gridWrap.innerHTML = `
        <div class="empty-state">
          <div class="display">Tu videoteca está vacía</div>
          <p>Agregá una serie o película para empezar a poblar tu colección.</p>
          <button class="btn btn-primary" onclick="document.getElementById('btnAdd').click()">+ Agregar el primer título</button>
        </div>`;
      return;
    }

    if(!items.length){
      gridWrap.innerHTML = `<div class="empty-state"><div class="display">Sin resultados</div><p>No hay títulos que coincidan con "${escapeHtml(searchTerm)}".</p></div>`;
      return;
    }

    let html = `<div class="grid">`;
    items.forEach(item => {
      const isOpen = expandedId === item.id;
      const posterStyle = item.poster ? `style="background-image:url('${escapeHtml(item.poster)}')"` : "";
      const epCount = item.type === "series" ? (item.episodes||[]).length : null;

      html += `
        <div class="card ${isOpen ? 'is-open':''}" data-id="${item.id}" data-action="toggle">
          <div class="poster" ${posterStyle}>
            ${item.poster ? "" : `<div class="fallback-title">${escapeHtml(item.title)}</div>`}
          </div>
          <div class="card-meta">
            <p class="card-title">${escapeHtml(item.title)}</p>
            <div class="card-sub">
              <span class="badge ${item.type === 'series' ? 'badge-series':'badge-movie'}">${item.type === 'series' ? 'Serie' : 'Película'}</span>
              ${epCount !== null ? `<span>${epCount} episodio${epCount===1?'':'s'}</span>` : ''}
            </div>
          </div>
        </div>`;

      if(isOpen){
        html += renderExpandPanel(item);
      }
    });
    html += `</div>`;
    gridWrap.innerHTML = html;
    attachGridEvents();
  }

  function renderExpandPanel(item){
    const isSeries = item.type === "series";
    let body = "";

    if(isSeries){
      const episodes = (item.episodes || []).slice().sort((a,b)=>
        a.season - b.season || a.episode - b.episode
      );
      const seasons = {};
      episodes.forEach(ep => {
        seasons[ep.season] = seasons[ep.season] || [];
        seasons[ep.season].push(ep);
      });

      body = `<div class="filmstrip">`;
      Object.keys(seasons).sort((a,b)=>a-b).forEach(seasonNum => {
        body += `<div class="season-row"><span class="sprocket"></span> TEMPORADA ${seasonNum}</div>`;
        seasons[seasonNum].forEach(ep => {
          body += `
            <div class="episode-row">
              <span class="ep-num">E${String(ep.episode).padStart(2,'0')}</span>
              <span class="ep-title">${escapeHtml(item.title)} · S${ep.season}E${ep.episode}</span>
              <div class="ep-actions">
                <button class="icon-btn play" title="Reproducir" data-action="play-ep" data-id="${item.id}" data-ep="${ep.id}">${icon('play')}</button>
                <button class="icon-btn" title="Editar episodio" data-action="edit-ep" data-id="${item.id}" data-ep="${ep.id}">${icon('edit')}</button>
                <button class="icon-btn danger" title="Eliminar episodio" data-action="delete-ep" data-id="${item.id}" data-ep="${ep.id}">${icon('trash')}</button>
              </div>
            </div>`;
        });
      });
      if(!episodes.length){
        body += `<div class="episode-row"><span class="ep-title" style="color:var(--text-dim)">Todavía no agregaste episodios.</span></div>`;
      }
      body += `
        <div class="add-episode-row">
          <button class="btn btn-sm btn-ghost" data-action="add-ep" data-id="${item.id}">+ Agregar episodio</button>
        </div>
      </div>`;
    } else {
      body = `
        <div class="filmstrip">
          <div class="episode-row">
            <span class="ep-title">Archivo único de la película</span>
            <div class="ep-actions">
              <button class="icon-btn play" title="Reproducir" data-action="play-movie" data-id="${item.id}">${icon('play')}</button>
            </div>
          </div>
        </div>`;
    }

    return `
      <div class="expand-panel">
        <div class="expand-head">
          <div>
            <h2>${escapeHtml(item.title)}</h2>
            <span class="badge ${isSeries ? 'badge-series':'badge-movie'}">${isSeries ? 'Serie' : 'Película'}</span>
          </div>
          <div class="expand-head-actions">
            <button class="btn btn-sm btn-ghost" data-action="edit-item" data-id="${item.id}">Editar</button>
            <button class="btn btn-sm btn-danger" data-action="delete-item" data-id="${item.id}">Eliminar</button>
          </div>
        </div>
        ${body}
      </div>`;
  }

  function icon(name){
    const icons = {
      play: '<svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M6 4.5L19 12L6 19.5V4.5Z" fill="currentColor"/></svg>',
      edit: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
      trash: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>',

  function bindAction(action, handler){

  /* ============ utilidades de streaming y subtítulos ============ */
  function isHttpStream(uri){
    return /^https?:\/\//i.test((uri || '').trim());
  }

  // Convierte subtítulos en formato SubRip (.srt) a formato WebVTT compatible con HTML5
  function srtToVtt(srtText){
    if(!srtText) return "WEBVTT\n\n";
    let text = srtText.trim();
    if(text.startsWith("WEBVTT")) return text;
    // Normalizar saltos de línea CRLF -> LF
    text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    // Convertir marcas de tiempo SRT a WebVTT: 00:01:23,456 --> 00:01:25,789 a 00:01:23.456 --> 00:01:25.789
    text = text.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2 --> $3.$4');
    return "WEBVTT\n\n" + text;
  }

  let activeSubtitleBlobUrl = null;

  function attachSubtitleToVideo(videoEl, contentOrUrl, filename = "Subtítulos", isRawContent = false){
    if(!videoEl) return;

    // Limpiar pistas anteriores
    const existingTracks = videoEl.querySelectorAll('track');
    existingTracks.forEach(t => t.remove());

    if(activeSubtitleBlobUrl){
      try{ URL.revokeObjectURL(activeSubtitleBlobUrl); }catch(e){}
      activeSubtitleBlobUrl = null;
    }

    if(isRawContent){
      const vtt = srtToVtt(contentOrUrl);
      const blob = new Blob([vtt], { type: 'text/vtt;charset=utf-8' });
      activeSubtitleBlobUrl = URL.createObjectURL(blob);
      createTrackElement(videoEl, activeSubtitleBlobUrl, filename);
      return;
    }

    const url = (contentOrUrl || '').trim();
    if(!url) return;

    fetch(url)
      .then(res => {
        if(!res.ok) throw new Error('Status ' + res.status);
        return res.text();
      })
      .then(text => {
        const vtt = srtToVtt(text);
        const blob = new Blob([vtt], { type: 'text/vtt;charset=utf-8' });
        activeSubtitleBlobUrl = URL.createObjectURL(blob);
        createTrackElement(videoEl, activeSubtitleBlobUrl, filename);
      })
      .catch(err => {
        console.warn("No se pudo obtener el subtítulo vía fetch (posible CORS), intentando asignación directa:", err);
        createTrackElement(videoEl, url, filename);
      });
  }

  function createTrackElement(videoEl, src, label){
    const track = document.createElement('track');
    track.kind = 'subtitles';
    track.label = label;
    track.srclang = 'es';
    track.src = src;
    track.default = true;
    videoEl.appendChild(track);

    setTimeout(() => {
      if(videoEl.textTracks && videoEl.textTracks.length > 0){
        for(let i = 0; i < videoEl.textTracks.length; i++){
          videoEl.textTracks[i].mode = 'showing';
        }
      }
    }, 150);
    showToast(`Subtítulo cargado: ${label}`);
  }

  // Los navegadores modernos bloquean subrecursos con formato http://user:pass@host/ por política de seguridad RFC 3986.
  // Limpiamos user:pass para el tag <video>, mientras que conservamos la URL original con credenciales para VLC y exportación.
  function sanitizeStreamUrlForBrowser(url){
    try {
      const parsed = new URL(url);
      if(parsed.username || parsed.password){
        parsed.username = '';
        parsed.password = '';
        return parsed.toString();
      }
    } catch(e){}
    return url;
  }

  function launchInExternalPlayer(streamUrl, title, subtitleUrl){
    const cleanTitle = (title || 'Stream').replace(/[\r\n]/g, ' ');
    let m3uContent = `#EXTM3U\n#EXTINF:-1,${cleanTitle}\n`;
    if(subtitleUrl && isHttpStream(subtitleUrl)){
      m3uContent += `#EXTVLCOPT:sub-file=${subtitleUrl.trim()}\n`;
    }
    m3uContent += `${streamUrl}\n`;
    const blob = new Blob([m3uContent], { type: 'audio/x-mpegurl' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${cleanTitle.replace(/[^a-zA-Z0-9_\-\s]/g, '').trim() || 'video'}.m3u`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2500);
    showToast("Descargando archivo .m3u (abrir con VLC o tu reproductor)");
  }

  function copyToClipboard(text, msg = "Enlace copiado al portapapeles"){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => fallbackCopy(text, msg));
    } else {
      fallbackCopy(text, msg);
    }
  }

  function fallbackCopy(text, msg){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast(msg);
    } catch(e){
      showToast("No se pudo copiar el enlace", true);
    }
    ta.remove();
  }

  /* ============ reproductor (HTTP & WebTorrent) ============ */
  function openPlayerForMovie(itemId){
    const item = findItem(itemId);
    if(!item || !item.torrent) return;
    openPlayer(item.torrent, item.title, item.subtitle);

  function openPlayerForEpisode(itemId, epId){
    const item = findItem(itemId);
    const ep = findEpisode(itemId, epId);
    if(!item || !ep) return;
    openPlayer(ep.torrent, `${item.title} · S${ep.season}E${ep.episode}`, ep.subtitle);

            <button class="btn btn-sm btn-ghost" id="playerBtnCopy" title="Copiar enlace">${icon('copy')} Copiar URL</button>
            <button class="btn btn-sm btn-ghost" id="playerBtnVlc" title="Descargar .m3u para VLC o reproductor externo">${icon('external')} Abrir en VLC</button>
            <button class="icon-btn" id="playerClose" title="Cerrar">${icon('close')}</button>
          </div>
        </div>
        <div class="player-body" id="playerBody">
          ${isHttp ? `
            <div class="player-status" id="playerStatus">
              Iniciando reproducción de stream HTTP…
            </div>
          ` : `
            <div class="player-status" id="playerStatus">
              Buscando peers WebTorrent…
              <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            </div>
          `}
        </div>
      </div>`;

    document.getElementById("playerClose").addEventListener('click', closePlayer);
    document.getElementById("playerBtnCopy").addEventListener('click', () => copyToClipboard(streamUri));
    document.getElementById("playerBtnVlc").addEventListener('click', () => launchInExternalPlayer(streamUri, label, initialSubtitle));

    // Carga de subtítulos vía selector de archivo
    const subFileInput = document.getElementById("playerSubFile");
    document.getElementById("playerBtnSub").addEventListener('click', () => {
      subFileInput.click();
    });
    subFileInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if(file) loadSubtitleFromFile(file);
      e.target.value = "";
    });

    // Carga de subtítulos arrastrando y soltando (Drag & Drop)
    const overlay = document.getElementById("playerOverlay");
    overlay.addEventListener('dragover', (e) => {
      e.preventDefault();
      overlay.classList.add('dragover');
    });
    overlay.addEventListener('dragleave', (e) => {
      if(!overlay.contains(e.relatedTarget)){
        overlay.classList.remove('dragover');
      }
    });
    overlay.addEventListener('drop', (e) => {
      e.preventDefault();
      overlay.classList.remove('dragover');
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if(file && /\.(srt|vtt)$/i.test(file.name)){
        loadSubtitleFromFile(file);
      } else if(file){
        showToast("El archivo de subtítulo debe ser .srt o .vtt", true);
      }
    });

    function loadSubtitleFromFile(file){
      const reader = new FileReader();
      reader.onload = (ev) => {
        const text = ev.target.result;
        const videoEl = document.getElementById("playerVideo");
        if(videoEl){
          attachSubtitleToVideo(videoEl, text, file.name.replace(/\.[^/.]+$/, ""), true);
        } else {
          showToast("Aguardá a que el reproductor inicie...", true);
        }
      };
      reader.readAsText(file, 'utf-8');
    }

    cleanupPlayback();

    if(isHttp){
      playHttpStream(streamUri, label, initialSubtitle);
    } else {
      playWebTorrentStream(streamUri, label, initialSubtitle);
    }
  }

  function playHttpStream(streamUri, label, initialSubtitle){
    const body = document.getElementById("playerBody");
    if(!body) return;

    const cleanUrl = sanitizeStreamUrlForBrowser(streamUri);

    body.innerHTML = `
      <video id="playerVideo" controls autoplay playsinline style="display:none;"></video>
      <div class="player-status" id="playerLoadingStatus">
        Conectando con el servidor de streaming…
      </div>`;

    const videoEl = document.getElementById("playerVideo");
    const loadingEl = document.getElementById("playerLoadingStatus");

    let hasDisplayed = false;
    function revealVideo(){
      if(!hasDisplayed && videoEl){
        hasDisplayed = true;
        videoEl.style.display = 'block';
        if(loadingEl && loadingEl.parentNode){
          loadingEl.parentNode.removeChild(loadingEl);
        }
        if(initialSubtitle){
          attachSubtitleToVideo(videoEl, initialSubtitle, "Subtítulo");
        }
      }
    }

    videoEl.addEventListener('loadeddata', revealVideo);
    videoEl.addEventListener('canplay', revealVideo);
    videoEl.addEventListener('playing', revealVideo);

    let triedOriginal = false;
    videoEl.addEventListener('error', () => {
      console.warn("Error en elemento video HTML5:", videoEl.error);
      if(!triedOriginal && cleanUrl !== streamUri){
        triedOriginal = true;
        console.log("Probando enlace original con credenciales...");
        videoEl.src = streamUri;
        videoEl.load();
        return;
      }
      showHttpFallbackUI(streamUri, label, initialSubtitle);
    });

    videoEl.src = cleanUrl;
    videoEl.load();
    const playPromise = videoEl.play();
    if(playPromise !== undefined){
      playPromise.catch(err => {
        console.log("Autoplay en espera de interacción o bloqueado por el navegador:", err);
      });
    }
  }

  function showHttpFallbackUI(streamUri, label, initialSubtitle){
    const body = document.getElementById("playerBody");
    if(!body) return;
    body.innerHTML = `
      <div class="player-error-box">
        <h3>No se pudo reproducir en el navegador</h3>
        <p>
          El navegador no pudo reproducir el stream directamente. Esto suele ocurrir si el video está en un contenedor o códec no soportado nativamente (como <strong>MKV</strong>, audio <strong>AC3 / EAC3 / DTS</strong>), o si el servidor local de torrent aún no está en ejecución.
        </p>
        <p style="font-size:0.82rem; color:var(--amber);">
          Podés abrirlo al instante en <strong>VLC</strong>, <strong>PotPlayer</strong> o <strong>MPV</strong> sin problemas de códecs:
        </p>
        <div class="player-btn-group">
          <button class="btn btn-primary" id="fallbackVlcBtn">${icon('external')} Reproducir en VLC (.m3u)</button>
          <button class="btn btn-ghost" id="fallbackCopyBtn">${icon('copy')} Copiar Stream URL</button>
        </div>
      </div>
    `;
    document.getElementById("fallbackVlcBtn").addEventListener('click', () => launchInExternalPlayer(streamUri, label, initialSubtitle));
    document.getElementById("fallbackCopyBtn").addEventListener('click', () => copyToClipboard(streamUri));
  }

  function playWebTorrentStream(magnetUri, label, initialSubtitle){
    if(typeof WebTorrent === 'undefined'){
      showToast("No se pudo cargar WebTorrent (revisá tu conexión a internet)", true);
      return;
    }

    torrentClient = new WebTorrent();

    torrentClient.on('error', (err) => {
      console.error(err);
      showToast("Error de WebTorrent: " + (err.message || err), true);
    });

    try {
      torrentClient.add(magnetUri, (torrent) => {
        activeTorrent = torrent;
        const file = torrent.files.slice().sort((a,b)=>b.length-a.length)
          .find(f => /\.(mp4|webm|mkv|mov|m4v|ogv)$/i.test(f.name)) || torrent.files[0];

        if(!file){
          showToast("El torrent no tiene archivos de video reconocibles", true);
          return;
        }

        const body = document.getElementById("playerBody");
        body.innerHTML = `<video id="playerVideo" controls autoplay playsinline></video>`;
        const videoEl = document.getElementById("playerVideo");
        file.renderTo(videoEl, { autoplay: true }, (err) => {
          if(err) showToast("No se pudo renderizar el archivo: " + err.message, true);
          else if(initialSubtitle){
            attachSubtitleToVideo(videoEl, initialSubtitle, "Subtítulo");
          }
        });

        torrent.on('download', () => updateProgress(torrent));
        updateProgress(torrent);
      });
    } catch(err){
      console.error(err);
      showToast("Error al procesar el enlace magnet: " + err.message, true);
    }
  }

  function updateProgress(torrent){
    const fill = document.getElementById("progressFill");
    const status = document.getElementById("playerStatus");
    if(!fill) return;
    const pct = Math.round((torrent.progress || 0) * 100);
    fill.style.width = pct + "%";
    if(status && document.getElementById("playerVideo") === null){
      status.firstChild.textContent = `Descargando… ${pct}% · ${torrent.numPeers} peer(s)`;
    }
  }

  function cleanupPlayback(){
    const videoEl = document.getElementById("playerVideo");
    if(videoEl){
      try {
        videoEl.pause();
        videoEl.removeAttribute('src');
        videoEl.load();
      } catch(e){}
    }
    if(activeSubtitleBlobUrl){
      try{ URL.revokeObjectURL(activeSubtitleBlobUrl); }catch(e){}
      activeSubtitleBlobUrl = null;
    }
    if(activeTorrent){
      try{ activeTorrent.destroy(); }catch(e){}
      activeTorrent = null;
    }
    if(torrentClient){
      try{ torrentClient.destroy(); }catch(e){}
      torrentClient = null;
    }
  }

  function closePlayer(){
    cleanupPlayback();
    document.getElementById("playerRoot").innerHTML = "";
  }

  window.addEventListener('beforeunload', cleanupPlayback);

  /* ============ import / export ============ */
  function exportLibrary(){
    const blob = new Blob([JSON.stringify(library, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `marquesina-biblioteca-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast("Biblioteca exportada");
  }

  function importLibraryFromFile(file){
    const reader = new FileReader();
    reader.onload = (e) => {
      let parsed;
      try{
        parsed = JSON.parse(e.target.result);
      }catch(err){
        showToast("El archivo no es un JSON válido", true);
        return;
      }
      if(!Array.isArray(parsed)){
        showToast("El JSON debe ser un array de títulos", true);
        return;
      }
      const normalized = normalizeImported(parsed);
      const replace = confirm(
        `Se encontraron ${normalized.length} título(s) en el archivo.\n\nAceptar = reemplazar toda tu biblioteca actual.\nCancelar = combinar con la biblioteca existente.`
      );
      if(replace){
        library = normalized;
      } else {
        normalized.forEach(it => library.push(it));
      }
      saveLibrary();
      expandedId = null;
      render();
      showToast("Importación completada");
    };
    reader.readAsText(file);
  }

  // Acepta tanto el formato agrupado (type/episodes) como el formato plano
  // de ejemplo (title/season/episode/torrent repetido por episodio).
  function normalizeImported(raw){
    const looksFlat = raw.length && raw[0] && raw[0].season !== undefined && raw[0].type === undefined;
    if(!looksFlat){
      return raw.map(it => ({
        id: it.id || uid(),
        type: it.type === 'movie' ? 'movie' : 'series',
        title: it.title || 'Sin título',
        poster: it.poster || '',
        torrent: it.torrent || '',
        subtitle: it.subtitle || '',
        episodes: Array.isArray(it.episodes) ? it.episodes.map(ep => ({
          id: ep.id || uid(),
          season: Number(ep.season) || 1,
          episode: Number(ep.episode) || 1,
          torrent: ep.torrent || '',
          subtitle: ep.subtitle || ''
        })) : []
      }));
    }
    // formato plano -> agrupar por título
    const grouped = {};
    raw.forEach(row => {
      const key = row.title || 'Sin título';
      if(!grouped[key]){
        grouped[key] = { id: uid(), type: 'series', title: key, poster: row.poster || '', episodes: [] };
      }
      grouped[key].episodes.push({
        id: uid(),
        season: Number(row.season) || 1,
        episode: Number(row.episode) || 1,
        torrent: row.torrent || '',
        subtitle: row.subtitle || ''
      });
    });
    return Object.values(grouped);
  }

  /* ============ listeners globales ============ */
  document.getElementById("btnAdd").addEventListener('click', () => openItemModal(null));
  document.getElementById("btnExport").addEventListener('click', exportLibrary);
  document.getElementById("btnImport").addEventListener('click', () => document.getElementById("importFile").click());
  document.getElementById("importFile").addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(file) importLibraryFromFile(file);
    e.target.value = "";
  });
  document.getElementById("searchInput").addEventListener('input', (e) => {
    searchTerm = e.target.value;
    render();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){
      if(document.getElementById("playerOverlay")) closePlayer();
      else if(document.getElementById("modalRoot").innerHTML) closeModal();
    }
  });

  render();
})();
</script>
</body>
</html>
