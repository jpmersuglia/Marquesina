<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marquesina — tu videoteca personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14161f;
    --bg-raised: #1c1f2b;
    --surface: #1e212d;
    --surface-2: #262a38;
    --border: #343a4d;
    --text: #edeae3;
    --text-dim: #a6a9b8;
    --amber: #e8a33d;
    --amber-dim: #a9772c;
    --teal: #4e8b8b;
    --danger: #c24a4a;
    --radius-card: 6px;
    --radius-pill: 999px;
    font-size: 16px;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(232,163,61,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(78,139,139,0.07), transparent 55%);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  h1,h2,h3, .display{
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  button{ font-family: inherit; }
  a{ color: inherit; }

  ::selection{ background: var(--amber); color: #1a1a1a; }

  /* focus visibility */
  :focus-visible{
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ---------- topbar ---------- */
  .topbar{
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 20px;
    padding: 18px 32px;
    background: rgba(20,22,31,0.88);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand{
    display:flex; align-items: baseline; gap: 8px;
    white-space: nowrap;
  }
  .brand .mark{
    font-family:'Fraunces', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--amber);
  }
  .brand .tag{
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .search-wrap{
    flex: 1;
    max-width: 420px;
  }
  .search-wrap input{
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 14px;
    border-radius: var(--radius-pill);
    font-size: 0.92rem;
  }
  .search-wrap input::placeholder{ color: var(--text-dim); }
  .topbar-actions{
    display:flex; gap: 10px; margin-left: auto;
    flex-wrap: wrap;
  }

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    border-radius: var(--radius-pill);
    padding: 9px 16px;
    font-size: 0.86rem;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .btn:hover{ border-color: #4a5169; background: var(--surface-2); }
  .btn-primary{
    background: var(--amber);
    color: #1a1408;
    border-color: var(--amber);
  }
  .btn-primary:hover{ background: #f0af4f; border-color:#f0af4f; }
  .btn-ghost{ background: transparent; }
  .btn-danger{ border-color: rgba(194,74,74,0.5); color:#e79a9a; background: transparent; }
  .btn-danger:hover{ background: rgba(194,74,74,0.12); border-color: var(--danger); }
  .btn-sm{ padding: 6px 12px; font-size: 0.78rem; }
  .icon{ width: 15px; height: 15px; flex-shrink:0; }

  /* ---------- layout ---------- */
  main{ padding: 32px; max-width: 1400px; margin: 0 auto; }
  .section-head{
    display:flex; align-items:baseline; justify-content: space-between;
    margin-bottom: 18px;
  }
  .section-head h1{ font-size: 1.5rem; margin:0; }
  .count-pill{
    font-size: 0.78rem; color: var(--text-dim);
    font-family: 'Inter', sans-serif; font-weight: 500;
  }

  .empty-state{
    border: 1px dashed var(--border);
    border-radius: var(--radius-card);
    padding: 64px 24px;
    text-align:center;
    color: var(--text-dim);
  }
  .empty-state .display{ color: var(--text); font-size: 1.3rem; margin-bottom:8px; }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 20px;
  }

  .card{
    position: relative;
    border-radius: var(--radius-card);
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: border-color .15s ease, transform .15s ease;
  }
  .card:hover{ border-color: var(--amber-dim); }
  .card.is-open{ border-color: var(--amber); }
  .poster{
    aspect-ratio: 2/3;
    width: 100%;
    background-size: cover;
    background-position: center;
    display:flex; align-items:flex-end;
    position: relative;
  }
  .poster::after{
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(180deg, transparent 40%, rgba(10,11,16,0.92) 100%);
  }
  .poster .fallback-title{
    position:relative; z-index:1;
    font-family:'Fraunces', serif;
    font-size: 1.6rem;
    line-height: 1.05;
    padding: 14px;
    color: var(--text);
    z-index: 2;
  }
  .card-meta{
    position: relative; z-index: 2;
    padding: 10px 12px 12px;
    margin-top: -46px;
  }
  .card-title{
    font-family:'Fraunces', serif;
    font-size: 1.02rem;
    font-weight: 600;
    line-height:1.2;
    margin: 0 0 4px;
    color: var(--text);
  }
  .card-sub{
    font-size: 0.74rem;
    color: var(--text-dim);
    display:flex; align-items:center; gap:6px;
  }
  .badge{
    display:inline-block;
    font-size: 0.66rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: var(--radius-pill);
    letter-spacing: 0.02em;
  }
  .badge-series{ background: rgba(78,139,139,0.22); color:#9fd6d6; }
  .badge-movie{ background: rgba(232,163,61,0.2); color: var(--amber); }

  /* ---------- expanded panel ---------- */
  .expand-panel{
    grid-column: 1 / -1;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 22px 26px 26px;
    margin-top: -4px;
    animation: reveal .18s ease-out;
  }
  @keyframes reveal{ from{ opacity:0; transform: translateY(-6px);} to{opacity:1; transform:none;} }

  .expand-head{
    display:flex; justify-content: space-between; align-items:flex-start;
    gap: 20px;
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .expand-head h2{ margin: 0 0 4px; font-size: 1.3rem; }
  .expand-head-actions{ display:flex; gap:8px; flex-shrink:0; }

  .filmstrip{
    display:flex; flex-direction: column;
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    overflow: hidden;
  }
  .season-row{
    display:flex; align-items:center; gap: 10px;
    padding: 10px 14px;
    background: var(--surface-2);
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }
  .sprocket{
    width:8px; height:8px; border-radius:50%;
    background: var(--border);
    flex-shrink:0;
  }
  .episode-row{
    display:flex; align-items:center; gap: 14px;
    padding: 11px 14px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  .episode-row:hover{ background: var(--surface-2); }
  .ep-num{
    font-family:'Fraunces', serif;
    font-size: 0.95rem;
    color: var(--amber);
    width: 30px;
    flex-shrink:0;
  }
  .ep-title{ flex:1; font-size: 0.88rem; }
  .ep-actions{ display:flex; gap:6px; flex-shrink:0; }

  .icon-btn{
    width: 30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor:pointer;
  }
  .icon-btn:hover{ color: var(--text); border-color: #4a5169; }
  .icon-btn.play{ color: var(--amber); border-color: rgba(232,163,61,0.4); }
  .icon-btn.play:hover{ background: rgba(232,163,61,0.15); }
  .icon-btn.danger:hover{ color:#e79a9a; border-color: var(--danger); background: rgba(194,74,74,0.1); }

  .add-episode-row{
    padding: 12px 14px;
    border-top: 1px solid var(--border);
  }

  /* ---------- modal ---------- */
  .modal-overlay{
    position: fixed; inset:0;
    background: rgba(10,11,16,0.7);
    backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center;
    z-index: 100;
    padding: 20px;
  }
  .modal{
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 100%; max-width: 460px;
    padding: 26px;
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal h2{ margin: 0 0 18px; font-size: 1.25rem; }
  .field{ margin-bottom: 14px; }
  .field label{
    display:block; font-size: 0.78rem; font-weight:600;
    color: var(--text-dim); margin-bottom: 6px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  .field textarea{ resize: vertical; min-height: 60px; }
  .field-row{ display:flex; gap: 12px; }
  .field-row .field{ flex:1; }
  .modal-actions{
    display:flex; justify-content:flex-end; gap: 10px; margin-top: 20px;
  }
  .hint{ font-size: 0.74rem; color: var(--text-dim); margin-top: 4px; }

  /* ---------- player modal ---------- */
  body.player-open{
    overflow: hidden !important;
  }
  .player-overlay{
    position: fixed; inset:0;
    width: 100vw; height: 100vh;
    background: #050608;
    z-index: 200;
    display:flex; flex-direction:column;
    overflow: hidden;
  }
  .player-top{
    display:flex; align-items:center; justify-content: space-between;
    padding: 14px 20px;
    color: var(--text-dim);
    font-size: 0.85rem;
    flex-shrink: 0;
  }
  .player-top .now{ color: var(--text); font-family:'Fraunces', serif; font-size: 1.05rem; }
  .player-body{
    flex:1;
    min-height: 0;
    min-width: 0;
    display:flex; align-items:center; justify-content:center;
    padding: 0 20px 20px;
    overflow: hidden;
  }
  video{
    max-width: 100%;
    max-height: 100%;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background:#000;
    border-radius: 6px;
  }
  .player-status{
    text-align:center; color: var(--text-dim); font-size: 0.85rem;
  }
  .progress-track{
    width: 260px; height:4px; background: var(--surface-2);
    border-radius: 2px; margin: 12px auto 0; overflow:hidden;
  }
  .progress-fill{ height:100%; background: var(--amber); width:0%; transition: width .3s ease; }

  .player-top-actions{ display:flex; align-items:center; gap:10px; }
  .player-tag{
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: var(--radius-pill);
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .player-tag.http{ border-color: rgba(78,139,139,0.5); color: #9fd6d6; }
  .player-tag.webtorrent{ border-color: rgba(232,163,61,0.5); color: var(--amber); }

  .player-error-box{
    text-align: center;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 30px 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .episode-row.is-watched{
    opacity: 0.65;
  }
  .episode-row.is-watched .ep-title{
    text-decoration: line-through;
    color: var(--text-dim);
  }
  .icon-btn.check{
    color: var(--text-dim);
  }
  .icon-btn.check.active{
    color: #4cd964;
    border-color: rgba(76, 217, 100, 0.4);
    background: rgba(76, 217, 100, 0.12);
  }
  .continue-badge{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(232, 163, 61, 0.15);
    border: 1px solid rgba(232, 163, 61, 0.4);
    color: var(--amber);
    padding: 4px 10px;
    border-radius: var(--radius-pill);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s ease;
  }
  .continue-badge:hover{
    background: rgba(232, 163, 61, 0.28);
  }

  /* Subtítulos personalizados (WebVTT) con selector de tamaño */
  video::cue {
    background: rgba(10, 11, 16, 0.88);
    color: #ffffff;
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 600;
    line-height: 1.35;
    text-shadow: 0 2px 4px rgba(0,0,0,0.95);
    font-size: 2.3rem; /* Extra grande por defecto (+100%) */
  }
  .sub-size-normal video::cue { font-size: 1.25rem; }
  .sub-size-large video::cue { font-size: 1.75rem; }
  .sub-size-xlarge video::cue { font-size: 2.3rem; }
  .sub-size-huge video::cue { font-size: 2.9rem; }

  /* Overlay de cuenta regresiva y auto-reproducción */
  .next-ep-card{
    position: absolute;
    bottom: 30px;
    right: 30px;
    background: rgba(28, 31, 43, 0.95);
    border: 1px solid var(--amber);
    border-radius: 10px;
    padding: 16px 20px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.75);
    backdrop-filter: blur(8px);
    z-index: 220;
    max-width: 360px;
    animation: slideUp .2s ease-out;
  }
  @keyframes slideUp{
    from{ opacity: 0; transform: translateY(12px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  .next-ep-card .title{
    font-size: 0.78rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .next-ep-card .ep-name{
    font-size: 0.96rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 12px;
  }
  .next-ep-card .actions{
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .countdown-pill{
    color: var(--amber);
    font-weight: 700;
  }

  .player-drop-hint{
    position: absolute;
    inset: 0;
    background: rgba(20, 22, 31, 0.88);
    border: 3px dashed var(--amber);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--amber);
    z-index: 250;
    pointer-events: none;
  }
  .player-overlay.dragover .player-drop-hint{
    display: flex;
  }

  .toast{
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 12px 20px; border-radius: var(--radius-pill);
    font-size: 0.85rem; z-index: 300;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .toast.error{ border-color: var(--danger); color: #f0b3b3; }

  /* Barra de progreso de descarga por episodio */
  .ep-buffer{
    display: none;
    align-items: center;
    gap: 8px;
    padding: 4px 10px 6px 40px; /* indent alineado con el ep-title */
    font-size: 0.72rem;
    color: var(--text-dim);
  }
  .ep-buffer.visible{ display: flex; }
  .ep-buffer-track{
    flex: 1;
    max-width: 180px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .ep-buffer-fill{
    height: 100%;
    background: var(--amber);
    border-radius: 2px;
    transition: width 0.6s ease;
  }
  .ep-buffer-fill.done{ background: #4cd964; }
  .ep-buffer-label{
    white-space: nowrap;
    min-width: 42px;
    color: var(--amber);
    font-weight: 600;
  }
  .ep-buffer-label.done{ color: #4cd964; }
  .ep-buffer-speed{ color: var(--text-dim); }

  /* Panel de buffer en el reproductor */
  .player-buffer-panel{
    position: absolute;
    top: 62px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 6px 24px;
    background: rgba(14,15,22,0.72);
    backdrop-filter: blur(4px);
    font-size: 0.75rem;
    color: var(--text-dim);
    z-index: 215;
    pointer-events: none;
  }
  .player-buffer-item{
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .player-buffer-item-label{ min-width: 160px; }
  .player-buf-track{
    width: 140px;
    height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
  }
  .player-buf-fill{
    height: 100%;
    background: var(--amber);
    border-radius: 2px;
    transition: width 0.6s ease;
  }
  .player-buf-fill.done{ background: #4cd964; }
  .player-buf-pct{ color: var(--amber); font-weight: 600; min-width: 36px; }
  .player-buf-pct.done{ color: #4cd964; }
  .player-buf-speed{ color: var(--text-dim); }

  input[type="file"]{ display:none; }

  @media (max-width: 640px){
    .topbar{ flex-wrap: wrap; padding: 14px 16px; }
    .search-wrap{ order: 3; max-width: none; width:100%; }
    main{ padding: 20px 16px; }
    .grid{ grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap:14px; }
    .player-body{ padding: 0 8px 12px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="mark">Marquesina</span>
    <span class="tag">tu videoteca personal</span>
  </div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Buscar título…" autocomplete="off">
  </div>
  <div class="topbar-actions">
    <button class="btn btn-ghost btn-sm" id="btnImport">Importar JSON</button>
    <button class="btn btn-ghost btn-sm" id="btnExport">Exportar JSON</button>
    <button class="btn btn-primary" id="btnAdd">+ Agregar</button>
  </div>
  <input type="file" id="importFile" accept="application/json">
</div>

<main>
  <div class="section-head">
    <h1>Tu colección</h1>
    <span class="count-pill" id="countPill"></span>
  </div>
  <div id="gridWrap"></div>
</main>

<div id="modalRoot"></div>
<div id="playerRoot"></div>
<div id="toastRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/webtorrent@2.6.6/webtorrent.min.js"></script>
<script>
(function(){
  "use strict";

  /* ============ estado y persistencia ============ */
  const STORAGE_KEY = "marquesina_library_v1";
  let library = loadLibrary();
  let expandedId = null;
  let searchTerm = "";
  let torrentClient = null;
  let activeTorrent = null;

  // Mapa de progreso de buffer torrent: key = `${magnet}::${fileIndex}` → { percent, speedKBps, prebuffering }
  const torrentProgress = new Map();
  let progressPollingInterval = null;
  const API_ORIGIN = () => (window.location.protocol.startsWith('http') && window.location.origin) ? window.location.origin : 'http://127.0.0.1:3333';

  // Parsea una URL /api/torrent/stream?magnet=...&fileIndex=N en { magnet, fileIndex }
  function parseTorrentStreamUrl(url) {
    if (!url || !url.startsWith('/api/torrent/')) return null;
    try {
      const u = new URL(API_ORIGIN() + url);
      const magnet = u.searchParams.get('magnet');
      const fileIndex = parseInt(u.searchParams.get('fileIndex') || '0', 10);
      if (!magnet) return null;
      return { magnet, fileIndex };
    } catch(e) { return null; }
  }

  // Inicia el prebuffer de un episodio (60MB por defecto) en el servidor
  function triggerPrebuffer(torrentUrl, label) {
    const info = parseTorrentStreamUrl(torrentUrl);
    if (!info) return;
    const url = `${API_ORIGIN()}/api/torrent/prebuffer?magnet=${encodeURIComponent(info.magnet)}&fileIndex=${info.fileIndex}`;
    fetch(url).then(r => r.json()).then(d => {
      if (d.started) console.log(`[Prebuffer] Iniciado: ${label || torrentUrl}`);
    }).catch(() => {});
  }

  // Aplica los datos de progreso torrent guardados en torrentProgress a los elementos del DOM
  function applyTorrentProgress() {
    torrentProgress.forEach((data, key) => {
      const [magnet, fileIndexStr] = key.split('::');
      const fileIndex = parseInt(fileIndexStr, 10);
      // Actualizar barra en lista de episodios
      const row = document.querySelector(`[data-torrent-key="${CSS.escape(key)}"]`);
      if (row) {
        const barEl = row.querySelector('.ep-buffer');
        if (barEl) {
          if (!data.engineReady && data.percent === 0) {
            barEl.classList.remove('visible');
            return;
          }
          barEl.classList.add('visible');
          const fill = barEl.querySelector('.ep-buffer-fill');
          const lbl = barEl.querySelector('.ep-buffer-label');
          const spd = barEl.querySelector('.ep-buffer-speed');
          if (fill) {
            fill.style.width = data.percent + '%';
            fill.classList.toggle('done', data.percent >= 100);
          }
          if (lbl) {
            lbl.textContent = data.percent >= 100 ? '✓ Listo' : data.percent + '%';
            lbl.classList.toggle('done', data.percent >= 100);
          }
          if (spd) {
            spd.textContent = data.percent >= 100 ? '' : (data.speedKBps > 0 ? `${data.speedKBps} KB/s` : 'Conectando…');
          }
        }
      }
    });
  }

  function loadLibrary(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){
      console.error("No se pudo leer la biblioteca guardada:", e);
      return [];
    }
  }

  function saveLibrary(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(library));
    }catch(e){
      showToast("No se pudo guardar en localStorage (¿espacio lleno?)", true);
    }
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /* ============ toast ============ */
  let toastTimer = null;
  function showToast(msg, isError){
    const root = document.getElementById("toastRoot");
    root.innerHTML = `<div class="toast ${isError ? 'error':''}">${escapeHtml(msg)}</div>`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ root.innerHTML = ""; }, 3200);
  }

  function escapeHtml(str){
    const d = document.createElement("div");
    d.textContent = str == null ? "" : String(str);
    return d.innerHTML;
  }

  /* ============ render principal ============ */
  function render(){
    const gridWrap = document.getElementById("gridWrap");
    const countPill = document.getElementById("countPill");
    const term = searchTerm.trim().toLowerCase();
    const items = library.filter(it => !term || it.title.toLowerCase().includes(term));

    countPill.textContent = library.length
      ? `${library.length} título${library.length === 1 ? '' : 's'}`
      : "";

    if(!library.length){
      gridWrap.innerHTML = `
        <div class="empty-state">
          <div class="display">Tu videoteca está vacía</div>
          <p>Agregá una serie o película para empezar a poblar tu colección.</p>
          <button class="btn btn-primary" onclick="document.getElementById('btnAdd').click()">+ Agregar el primer título</button>
        </div>`;
      return;
    }

    if(!items.length){
      gridWrap.innerHTML = `<div class="empty-state"><div class="display">Sin resultados</div><p>No hay títulos que coincidan con "${escapeHtml(searchTerm)}".</p></div>`;
      return;
    }

    let html = `<div class="grid">`;
    items.forEach(item => {
      const isOpen = expandedId === item.id;
      const posterStyle = item.poster ? `style="background-image:url('${escapeHtml(item.poster)}')"` : "";
      const epCount = item.type === "series" ? (item.episodes||[]).length : null;

      html += `
        <div class="card ${isOpen ? 'is-open':''}" data-id="${item.id}" data-action="toggle">
          <div class="poster" ${posterStyle}>
            ${item.poster ? "" : `<div class="fallback-title">${escapeHtml(item.title)}</div>`}
          </div>
          <div class="card-meta">
            <p class="card-title">${escapeHtml(item.title)}</p>
            <div class="card-sub">
              <span class="badge ${item.type === 'series' ? 'badge-series':'badge-movie'}">${item.type === 'series' ? 'Serie' : 'Película'}</span>
              ${epCount !== null ? `<span>${epCount} episodio${epCount===1?'':'s'}</span>` : ''}
            </div>
          </div>
        </div>`;

      if(isOpen){
        html += renderExpandPanel(item);
      }
    });
    html += `</div>`;
    gridWrap.innerHTML = html;
    attachGridEvents();
    applyTorrentProgress();
  }

  function renderExpandPanel(item){
    const isSeries = item.type === "series";
    let body = "";

    if(isSeries){
      const episodes = (item.episodes || []).slice().sort((a,b)=>
        a.season - b.season || a.episode - b.episode
      );
      const seasons = {};
      episodes.forEach(ep => {
        seasons[ep.season] = seasons[ep.season] || [];
        seasons[ep.season].push(ep);
      });

      // Buscar primer episodio no visto para botón "Continuar viendo"
      const nextUnwatched = episodes.find(e => !e.watched);

      body = `<div class="filmstrip">`;
      Object.keys(seasons).sort((a,b)=>a-b).forEach(seasonNum => {
        body += `<div class="season-row"><span class="sprocket"></span> TEMPORADA ${seasonNum}</div>`;
        seasons[seasonNum].forEach(ep => {
          const isWatched = !!ep.watched;
          const epTorrentInfo = parseTorrentStreamUrl(ep.torrent || '');
          const torrentKey = epTorrentInfo ? `${epTorrentInfo.magnet}::${epTorrentInfo.fileIndex}` : '';
          body += `
            <div class="episode-row ${isWatched ? 'is-watched' : ''}" ${torrentKey ? `data-torrent-key="${escapeHtml(torrentKey)}"` : ''}>
              <button class="icon-btn check ${isWatched ? 'active' : ''}" title="${isWatched ? 'Marcar como no visto' : 'Marcar como visto'}" data-action="toggle-watched" data-id="${item.id}" data-ep="${ep.id}">${icon('check')}</button>
              <span class="ep-num">E${String(ep.episode).padStart(2,'0')}</span>
              <span class="ep-title">${escapeHtml(item.title)} · S${ep.season}E${ep.episode}</span>
              <div class="ep-actions">
                <button class="icon-btn play" title="Reproducir" data-action="play-ep" data-id="${item.id}" data-ep="${ep.id}">${icon('play')}</button>
                <button class="icon-btn" title="Editar episodio" data-action="edit-ep" data-id="${item.id}" data-ep="${ep.id}">${icon('edit')}</button>
                <button class="icon-btn danger" title="Eliminar episodio" data-action="delete-ep" data-id="${item.id}" data-ep="${ep.id}">${icon('trash')}</button>
              </div>
            </div>
            ${torrentKey ? `
            <div class="ep-buffer" style="display:none;">
              <div class="ep-buffer-track"><div class="ep-buffer-fill" style="width:0%"></div></div>
              <span class="ep-buffer-label">0%</span>
              <span class="ep-buffer-speed"></span>
            </div>` : ''}`;
        });
      });
      if(!episodes.length){
        body += `<div class="episode-row"><span class="ep-title" style="color:var(--text-dim)">Todavía no agregaste episodios.</span></div>`;
      }
      body += `
        <div class="add-episode-row" style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn btn-sm btn-ghost" data-action="add-ep" data-id="${item.id}">+ Agregar episodio manual</button>
          <button class="btn btn-sm btn-primary" data-action="import-torrent-ep" data-id="${item.id}">${icon('spark')} Importar temporada desde Torrent / Magnet</button>
        </div>
      </div>`;
    } else {
      body = `
        <div class="filmstrip">
          <div class="episode-row">
            <span class="ep-title">Archivo único de la película</span>
            <div class="ep-actions">
              <button class="icon-btn play" title="Reproducir" data-action="play-movie" data-id="${item.id}">${icon('play')}</button>
            </div>
          </div>
        </div>`;
    }

    const nextUnwatched = (isSeries && item.episodes) ? item.episodes.slice().sort((a,b)=>a.season-b.season || a.episode-b.episode).find(e => !e.watched) : null;

    return `
      <div class="expand-panel">
        <div class="expand-head">
          <div>
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:6px;">
              <h2 style="margin:0;">${escapeHtml(item.title)}</h2>
              <span class="badge ${isSeries ? 'badge-series':'badge-movie'}">${isSeries ? 'Serie' : 'Película'}</span>
            </div>
            ${nextUnwatched ? `
              <div class="continue-badge" data-action="play-ep" data-id="${item.id}" data-ep="${nextUnwatched.id}" title="Continuar reproducción">
                ${icon('play')} Continuar viendo: S${nextUnwatched.season}E${nextUnwatched.episode}
              </div>
            ` : ''}
          </div>
          <div class="expand-head-actions">
            <button class="btn btn-sm btn-ghost" data-action="edit-item" data-id="${item.id}">Editar</button>
            <button class="btn btn-sm btn-danger" data-action="delete-item" data-id="${item.id}">Eliminar</button>
          </div>
        </div>
        ${body}
      </div>`;
  }

  function icon(name){
    const icons = {
      play: '<svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M6 4.5L19 12L6 19.5V4.5Z" fill="currentColor"/></svg>',

  /* ============ eventos del grid ============ */
  function attachGridEvents(){
    document.querySelectorAll('[data-action="toggle"]').forEach(card => {
      card.addEventListener('click', (e) => {
        const id = card.dataset.id;
        expandedId = expandedId === id ? null : id;
        render();
      });
    });

    bindAction('play-movie', (id) => openPlayerForMovie(id));
    bindAction('play-ep', (id, epId) => openPlayerForEpisode(id, epId));
    bindAction('edit-item', (id) => openItemModal(findItem(id)));
    bindAction('delete-item', (id) => confirmDeleteItem(id));
    bindAction('add-ep', (id) => openEpisodeModal(id, null));
    bindAction('import-torrent-ep', (id) => openTorrentImportModal(id));
    bindAction('edit-ep', (id, epId) => openEpisodeModal(id, epId));
    bindAction('delete-ep', (id, epId) => confirmDeleteEpisode(id, epId));
    bindAction('toggle-watched', (id, epId) => toggleWatched(id, epId));
  }

  function bindAction(action, handler){
    document.querySelectorAll(`[data-action="${action}"]`).forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        handler(el.dataset.id, el.dataset.ep);
      });
    });
  }

  function findItem(id){ return library.find(it => it.id === id); }
  function findEpisode(itemId, epId){
    const item = findItem(itemId);
    return item ? (item.episodes||[]).find(ep => ep.id === epId) : null;
  }

  function findNextEpisode(itemId, epId){
    const item = findItem(itemId);
    if(!item || !item.episodes) return null;
    const episodes = item.episodes.slice().sort((a,b)=> a.season - b.season || a.episode - b.episode);
    const currentIndex = episodes.findIndex(ep => ep.id === epId);
    if(currentIndex >= 0 && currentIndex < episodes.length - 1){
      return episodes[currentIndex + 1];
    }
    return null;
  }

  function toggleWatched(itemId, epId, forceState = null){
    const ep = findEpisode(itemId, epId);
    if(!ep) return;
    ep.watched = forceState !== null ? forceState : !ep.watched;
    saveLibrary();
    render();
    if(forceState === null){
      showToast(ep.watched ? `Episodio S${ep.season}E${ep.episode} marcado como visto` : `Episodio S${ep.season}E${ep.episode} marcado como no visto`);
    }
  }

  /* ============ modal: crear/editar Serie o Película ============ */
  function openItemModal(existing){
    const isEdit = !!existing;
    const type = existing ? existing.type : "series";
    const modalRoot = document.getElementById("modalRoot");

    modalRoot.innerHTML = `
      <div class="modal-overlay" id="itemModalOverlay">
        <div class="modal">
          <h2>${isEdit ? 'Editar título' : 'Agregar título'}</h2>
          <div class="field">
            <label>Tipo</label>
            <select id="fType" ${isEdit ? 'disabled' : ''}>
              <option value="series" ${type==='series'?'selected':''}>Serie</option>
              <option value="movie" ${type==='movie'?'selected':''}>Película</option>
            </select>
          </div>
          <div class="field">
            <label>Título</label>
            <input type="text" id="fTitle" value="${existing ? escapeHtml(existing.title) : ''}" placeholder="Ej: Breaking Bad">
          </div>
          <div class="field">
            <label>Poster (URL de imagen, opcional)</label>
            <input type="text" id="fPoster" value="${existing ? escapeHtml(existing.poster||'') : ''}" placeholder="https://...">
          </div>
          <div class="field" id="movieTorrentField" style="${type==='movie' ? '' : 'display:none'}">
            <label>Enlace de la película (Stream URL HTTP o Magnet)</label>
            <input type="text" id="fTorrent" value="${existing && existing.type==='movie' ? escapeHtml(existing.torrent||'') : ''}" placeholder="http://127.0.0.1:... o magnet:?xt=urn:btih:...">
            <p class="hint">Soporta enlaces de streaming HTTP (TorrServer, AceStream, etc.) y enlaces Magnet.</p>
          </div>
          <div class="field" id="movieSubtitleField" style="${type==='movie' ? '' : 'display:none'}">
            <label>Subtítulos de la película (URL .srt o .vtt, opcional)</label>
            <input type="text" id="fSubtitle" value="${existing && existing.type==='movie' ? escapeHtml(existing.subtitle||'') : ''}" placeholder="https://... o http://127.0.0.1:.../sub.srt">
            <p class="hint">También podés cargar o arrastrar un archivo .srt directamente en el reproductor.</p>
          </div>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="itemCancel">Cancelar</button>
            <button class="btn btn-primary" id="itemSave">${isEdit ? 'Guardar cambios' : 'Agregar'}</button>
          </div>
        </div>
      </div>`;

    const overlay = document.getElementById("itemModalOverlay");
    const typeSelect = document.getElementById("fType");
    typeSelect.addEventListener('change', () => {
      const isMov = typeSelect.value === 'movie';
      document.getElementById("movieTorrentField").style.display = isMov ? '' : 'none';
      document.getElementById("movieSubtitleField").style.display = isMov ? '' : 'none';
    });

    overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
    document.getElementById("itemCancel").addEventListener('click', closeModal);
    document.getElementById("itemSave").addEventListener('click', () => {
      const title = document.getElementById("fTitle").value.trim();
      const poster = document.getElementById("fPoster").value.trim();
      const chosenType = typeSelect.value;

      if(!title){ showToast("El título es obligatorio", true); return; }
      if(chosenType === 'movie'){
        const torrent = document.getElementById("fTorrent").value.trim();
        const subtitle = document.getElementById("fSubtitle").value.trim();
        if(!torrent){ showToast("Falta el enlace o stream URL de la película", true); return; }
        if(isEdit){
          existing.title = title; existing.poster = poster; existing.torrent = torrent; existing.subtitle = subtitle;
        } else {
          library.push({ id: uid(), type: 'movie', title, poster, torrent, subtitle });
        }
      } else {
        if(isEdit){
          existing.title = title; existing.poster = poster;
        } else {
          library.push({ id: uid(), type: 'series', title, poster, episodes: [] });
        }
      }
      saveLibrary();
      closeModal();
      render();
      showToast(isEdit ? "Título actualizado" : "Título agregado");
    });
  }

  function confirmDeleteItem(id){
    const item = findItem(id);
    if(!item) return;
    if(!confirm(`¿Eliminar "${item.title}" de tu videoteca? Esta acción no se puede deshacer.`)) return;
    library = library.filter(it => it.id !== id);
    if(expandedId === id) expandedId = null;
    saveLibrary();
    render();
    showToast("Título eliminado");
  }

  /* ============ modal: crear/editar episodio ============ */
  function openEpisodeModal(itemId, epId){
    const item = findItem(itemId);
    if(!item) return;
    const existing = epId ? findEpisode(itemId, epId) : null;
    const isEdit = !!existing;

    let nextSeason = 1, nextEpisode = 1;
    if(!isEdit && item.episodes && item.episodes.length){
      const last = item.episodes[item.episodes.length - 1];
      nextSeason = last.season;
      nextEpisode = last.episode + 1;
    }

    const modalRoot = document.getElementById("modalRoot");
    modalRoot.innerHTML = `
      <div class="modal-overlay" id="epModalOverlay">
        <div class="modal">
          <h2>${isEdit ? 'Editar episodio' : 'Agregar episodio'} — ${escapeHtml(item.title)}</h2>
          <div class="field-row">
            <div class="field">
              <label>Temporada</label>
              <input type="number" min="1" id="fSeason" value="${existing ? existing.season : nextSeason}">
            </div>
            <div class="field">
              <label>Episodio</label>
              <input type="number" min="1" id="fEpisode" value="${existing ? existing.episode : nextEpisode}">

            <p class="hint">Soporta enlaces de streaming HTTP (TorrServer, AceStream, etc.) y enlaces Magnet.</p>
          </div>
          <div class="field">
            <label>Subtítulos del episodio (URL .srt o .vtt, opcional)</label>
            <input type="text" id="fEpSubtitle" value="${existing ? escapeHtml(existing.subtitle||'') : ''}" placeholder="https://... o http://127.0.0.1:.../sub.srt">
            <p class="hint">También podés cargar o arrastrar un archivo .srt directamente en el reproductor.</p>
          </div>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="epCancel">Cancelar</button>
            <button class="btn btn-primary" id="epSave">${isEdit ? 'Guardar cambios' : 'Agregar'}</button>

        </div>
      </div>`;

    const overlay = document.getElementById("epModalOverlay");
    overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
    document.getElementById("epCancel").addEventListener('click', closeModal);
    document.getElementById("epSave").addEventListener('click', () => {

      }
      saveLibrary();
      closeModal();
      render();
      showToast(isEdit ? "Episodio actualizado" : "Episodio agregado");
    });
  }

  function confirmDeleteEpisode(itemId, epId){
    const item = findItem(itemId);
    if(!item) return;
    const ep = findEpisode(itemId, epId);
    if(!ep) return;
    if(!confirm(`¿Eliminar el episodio S${ep.season}E${ep.episode}?`)) return;
    item.episodes = item.episodes.filter(e => e.id !== epId);
    saveLibrary();
    render();
    showToast("Episodio eliminado");
  }

    inspectBtn.addEventListener('click', () => {
      const magnetVal = magnetInput.value.trim();
      if(!magnetVal){
        showToast("Pegá un enlace Magnet o infoHash primero", true);
        return;
      }

      inspectBtn.disabled = true;
      inspectBtn.textContent = "Conectando con peers…";
      statusEl.textContent = "Consultando metadatos en la red P2P (esto puede demorar unos segundos)...";
      previewEl.style.display = 'none';
      saveBtn.style.display = 'none';

      const origin = (window.location.protocol.startsWith('http') && window.location.origin) ? window.location.origin : 'http://127.0.0.1:3333';
      const inspectUrl = origin + '/api/torrent/inspect?magnet=' + encodeURIComponent(magnetVal);

      fetch(inspectUrl)
        .then(res => {
          if(!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(data => {
          inspectBtn.disabled = false;
          inspectBtn.textContent = "Analizar Torrent";
          if(data.error){
            statusEl.textContent = "Error: " + data.error;
            showToast(data.error, true);
            return;
          }

          const files = data.files || [];
          const videoRegex = /\.(mp4|mkv|avi|webm|mov|m4v)$/i;
          const subRegex = /\.(srt|vtt)$/i;

          const videoFiles = files.filter(f => videoRegex.test(f.name));
          const subFiles = files.filter(f => subRegex.test(f.name));

          if(!videoFiles.length){
            statusEl.textContent = `Se encontraron ${files.length} archivos, pero ninguno es video compatible.`;
            return;
          }

          detectedEpisodes = [];
          videoFiles.forEach((vf) => {
            const seMatch = vf.name.match(/[Ss](\d{1,2})[Ee](\d{1,2})/i) || vf.name.match(/(\d{1,2})x(\d{1,2})/i);
            const season = seMatch ? parseInt(seMatch[1], 10) : 1;
            const episode = seMatch ? parseInt(seMatch[2], 10) : (detectedEpisodes.length + 1);

            // Buscar subtítulo para este episodio
            let matchingSub = subFiles.find(sf => {
              const subMatch = sf.name.match(/[Ss](\d{1,2})[Ee](\d{1,2})/i) || sf.name.match(/(\d{1,2})x(\d{1,2})/i);
              return subMatch && parseInt(subMatch[1], 10) === season && parseInt(subMatch[2], 10) === episode;
            });

            // Si el nombre de la carpeta contiene S01E01, buscar también por ruta completa
            if(!matchingSub){
              matchingSub = subFiles.find(sf => {
                const subMatch = sf.path.match(/[Ss](\d{1,2})[Ee](\d{1,2})/i) || sf.path.match(/(\d{1,2})x(\d{1,2})/i);
                return subMatch && parseInt(subMatch[1], 10) === season && parseInt(subMatch[2], 10) === episode;
              });
            }

            detectedEpisodes.push({
              season,
              episode,
              videoFile: vf,
              subFile: matchingSub || null,
              torrent: magnetVal,
              fileIndex: vf.index,
              subFileIndex: matchingSub ? matchingSub.index : null
            });
          });

          detectedEpisodes.sort((a,b) => a.season - b.season || a.episode - b.episode);

          statusEl.textContent = `¡Listo! Se detectaron ${detectedEpisodes.length} episodio(s) en ${data.name || 'el torrent'}.`;
          let html = `<div style="font-size:0.82rem;">`;
          detectedEpisodes.forEach(ep => {
            html += `
              <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--border);">
                <div>
                  <strong style="color:var(--amber);">S${ep.season}E${ep.episode}</strong>: ${escapeHtml(ep.videoFile.name)}
                  <div style="font-size:0.74rem; color:var(--text-dim);">
                    ${(ep.videoFile.length / (1024*1024)).toFixed(1)} MB
                    ${ep.subFile ? ` · <span style="color:#9fd6d6;">✓ Subtítulo detectado: ${escapeHtml(ep.subFile.name)}</span>` : ' · <span style="color:var(--text-dim);">(sin subtítulo en torrent)</span>'}
                  </div>
                </div>
              </div>`;
          });
          html += `</div>`;
          previewEl.innerHTML = html;
          previewEl.style.display = 'block';
          saveBtn.style.display = '';
        })
        .catch(err => {
          inspectBtn.disabled = false;
          inspectBtn.textContent = "Analizar Torrent";
          statusEl.textContent = "Error al conectar con el servidor: " + err.message;
          showToast("Asegurate de que el servidor esté iniciado con 'iniciar.bat'", true);
        });
    });

    saveBtn.addEventListener('click', () => {
      if(!detectedEpisodes.length) return;
      item.episodes = item.episodes || [];

      let addedCount = 0;
      let updatedCount = 0;

      detectedEpisodes.forEach(newEp => {
        const streamUrl = `/api/torrent/stream?magnet=${encodeURIComponent(newEp.torrent)}&fileIndex=${newEp.fileIndex}`;
        const subUrl = newEp.subFileIndex !== null
          ? `/api/torrent/sub?magnet=${encodeURIComponent(newEp.torrent)}&fileIndex=${newEp.subFileIndex}`
          : '';

        const existingEp = item.episodes.find(e => e.season === newEp.season && e.episode === newEp.episode);
        if(existingEp){
          existingEp.torrent = streamUrl;
          if(subUrl) existingEp.subtitle = subUrl;
          existingEp.rawTorrent = newEp.torrent;
          existingEp.fileIndex = newEp.fileIndex;
          existingEp.subFileIndex = newEp.subFileIndex;
          updatedCount++;
        } else {
          item.episodes.push({
            id: uid(),
            season: newEp.season,
            episode: newEp.episode,
            torrent: streamUrl,
            subtitle: subUrl,
            rawTorrent: newEp.torrent,
            fileIndex: newEp.fileIndex,
            subFileIndex: newEp.subFileIndex
          });
          addedCount++;
        }
      });

      saveLibrary();
      closeModal();
      render();
      showToast(`Temporada importada: ${addedCount} nuevo(s), ${updatedCount} actualizado(s)`);
    });
  }

  function closeModal(){
    document.getElementById("modalRoot").innerHTML = "";

  /* ============ utilidades de streaming y subtítulos ============ */
  function isHttpStream(uri){
    const s = (uri || '').trim();
    return /^https?:\/\//i.test(s) || s.startsWith('/api/');
  }

  function isMagnet(uri){
    return /^magnet:\?/i.test((uri || '').trim());
  }

  // Decodifica buffer con UTF-8 y fallback a Windows-1252 / ISO-8859-1 para caracteres en español (tildes, ñ)
  function decodeSubtitleText(buffer){
    if(typeof buffer === 'string') return buffer;
    try {
      const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
      return utf8Decoder.decode(buffer);
    } catch(e){
      try {
        const latinDecoder = new TextDecoder('windows-1252');
        return latinDecoder.decode(buffer);
      } catch(err){
        return new TextDecoder('utf-8').decode(buffer);
      }
    }
  }

  // Convierte subtítulos en formato SubRip (.srt) a formato WebVTT compatible con HTML5
  function srtToVtt(srtText){
    if(!srtText) return "WEBVTT\n\n";
    let text = srtText.trim();
    if(text.startsWith("WEBVTT")) return text;
    // Normalizar saltos de línea CRLF -> LF
    text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    // Convertir marcas de tiempo SRT a WebVTT: 00:01:23,456 --> 00:01:25,789 a 00:01:23.456 --> 00:01:25.789
    text = text.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2 --> $3.$4');
    return "WEBVTT\n\n" + text;
  }

  let activeSubtitleBlobUrl = null;

  function attachSubtitleToVideo(videoEl, contentOrUrl, filename = "Subtítulos", isRawContent = false){
    if(!videoEl) return;

    if(activeSubtitleBlobUrl){
      try{ URL.revokeObjectURL(activeSubtitleBlobUrl); }catch(e){}
      activeSubtitleBlobUrl = null;
    }

    if(isRawContent){
      const vtt = srtToVtt(contentOrUrl);
      const blob = new Blob([vtt], { type: 'text/vtt;charset=utf-8' });
      activeSubtitleBlobUrl = URL.createObjectURL(blob);
      createTrackElement(videoEl, activeSubtitleBlobUrl, filename);
      return;
    }

    const url = (contentOrUrl || '').trim();
    if(!url) return;

    // 1. Soporte para subtítulos desde un Magnet link directo
    if(isMagnet(url)){
      loadSubtitleFromMagnet(url, videoEl, filename);
      return;
    }

    // 2. Soporte para URLs del motor interno (/api/torrent/sub...)
    if(url.startsWith('/api/torrent/sub')){
      const origin = (window.location.protocol.startsWith('http') && window.location.origin) ? window.location.origin : 'http://127.0.0.1:3333';
      const directUrl = origin + url;
      fetch(directUrl)
        .then(res => {
          if(!res.ok) throw new Error('API Sub ' + res.status);
          return res.text();
        })
        .then(vttText => {
          const blob = new Blob([vttText], { type: 'text/vtt;charset=utf-8' });
          activeSubtitleBlobUrl = URL.createObjectURL(blob);
          createTrackElement(videoEl, activeSubtitleBlobUrl, filename);
        })
        .catch(err => {
          console.warn("Error cargando subtítulo del torrent interno:", err);
          showToast("Aguardando subtítulos del torrent...", false);
        });
      return;
    }

    // 3. Soporte para URLs HTTP/HTTPS externas (BitTorrent Web, TorrServer, etc.)
    // Si el servidor local bridge está activo, usar el endpoint puente que agrega CORS y convierte a WebVTT
    const origin = (window.location.protocol.startsWith('http') && window.location.origin) ? window.location.origin : 'http://127.0.0.1:3333';
    const bridgeUrl = origin + '/api/sub?url=' + encodeURIComponent(url);

    fetch(bridgeUrl)
      .then(res => {
        if(!res.ok) throw new Error('Bridge ' + res.status);
        return res.text();
      })
      .then(vttText => {
        const blob = new Blob([vttText], { type: 'text/vtt;charset=utf-8' });
        activeSubtitleBlobUrl = URL.createObjectURL(blob);
        createTrackElement(videoEl, activeSubtitleBlobUrl, filename);
      })
      .catch(() => {
        // Fallback: Si el bridge no está corriendo, intentar fetch directo (limpiando credenciales para Firefox)
        const cleanUrl = sanitizeStreamUrlForBrowser(url);
        fetch(cleanUrl)
          .then(res => {
            if(!res.ok) throw new Error('HTTP ' + res.status);
            return res.arrayBuffer();
          })
          .then(buffer => {
            const text = decodeSubtitleText(buffer);
            const vtt = srtToVtt(text);
            const blob = new Blob([vtt], { type: 'text/vtt;charset=utf-8' });
            activeSubtitleBlobUrl = URL.createObjectURL(blob);
            createTrackElement(videoEl, activeSubtitleBlobUrl, filename);
          })
          .catch(err => {
            console.warn("Fallo CORS al cargar subtítulo directamente de BitTorrent Web:", err);
            showToast("BitTorrent Web bloquea los subtítulos por CORS. Abrí Marquesina con 'iniciar.bat' o arrastrá el .srt al video", true);
          });
      });
  }

  function loadSubtitleFromMagnet(magnetUri, videoEl, label = "Subtítulo Magnet"){
    if(typeof WebTorrent === 'undefined'){
      showToast("WebTorrent no está cargado", true);
      return;
    }
    showToast("Buscando subtítulo en el enjambre torrent…");
    const subClient = new WebTorrent();
    subClient.on('error', (err) => console.warn("Error en cliente de subtítulo torrent:", err));
    try {
      subClient.add(magnetUri, (torrent) => {
        const subFile = torrent.files.find(f => /\.(srt|vtt)$/i.test(f.name));
        if(!subFile){
          showToast("No se encontró ningún archivo .srt o .vtt en el magnet", true);
          try{ subClient.destroy(); }catch(e){}
          return;
        }
        subFile.getBuffer((err, buffer) => {
          if(err){
            showToast("No se pudo descargar el archivo de subtítulo del torrent", true);
          } else {
            const text = decodeSubtitleText(buffer);
            attachSubtitleToVideo(videoEl, text, subFile.name.replace(/\.[^/.]+$/, ""), true);
          }
          try{ subClient.destroy(); }catch(e){}
        });
      });
    } catch(err){
      console.warn("Error con magnet de subtítulo:", err);
      showToast("Magnet de subtítulo inválido", true);
      try{ subClient.destroy(); }catch(e){}
    }
  }

  function createTrackElement(videoEl, src, label){
    if(!videoEl) return;

    // Obtener pista existente o crearla (para que el botón CC nativo de Firefox siempre esté presente)
    let track = videoEl.querySelector('track');
    if(!track){
      track = document.createElement('track');
      track.kind = 'subtitles';
      track.srclang = 'es';
      track.default = true;
      videoEl.appendChild(track);
    }
    track.label = label;
    track.src = src;

    // En Firefox, el modo 'showing' debe activarse en el evento load del track
    track.addEventListener('load', function(){
      if(this.track){
        this.track.mode = 'showing';
      }
    });

    // Forzar activación del modo showing en Firefox y Chrome en varios intervalos
    const forceShowing = () => {
      try {
        if(track.track){
          track.track.mode = 'showing';
        }
        if(videoEl.textTracks){
          for(let i = 0; i < videoEl.textTracks.length; i++){
            videoEl.textTracks[i].mode = 'showing';
          }
        }
      } catch(e){}
    };

    forceShowing();
    setTimeout(forceShowing, 50);
    setTimeout(forceShowing, 250);
    setTimeout(forceShowing, 800);

    showToast(`Subtítulo activado: ${label}`);
  }

  // Los navegadores modernos bloquean subrecursos con formato http://user:pass@host/ por política de seguridad RFC 3986.
  // Limpiamos user:pass para el tag <video>, mientras que conservamos la URL original con credenciales para VLC y exportación.
  function sanitizeStreamUrlForBrowser(url){
    try {
      const parsed = new URL(url);
      if(parsed.username || parsed.password){
        parsed.username = '';
        parsed.password = '';
        return parsed.toString();
      }
    } catch(e){}
    return url;
  }

  function launchInExternalPlayer(streamUrl, title, subtitleUrl){
    const cleanTitle = (title || 'Stream').replace(/[\r\n]/g, ' ');
    const origin = (window.location.protocol.startsWith('http') && window.location.origin) ? window.location.origin : 'http://127.0.0.1:3333';
    const absStreamUrl = streamUrl.startsWith('/') ? origin + streamUrl : streamUrl;
    const absSubUrl = (subtitleUrl && subtitleUrl.startsWith('/')) ? origin + subtitleUrl : subtitleUrl;

    let m3uContent = `#EXTM3U\n#EXTINF:-1,${cleanTitle}\n`;
    if(absSubUrl && isHttpStream(absSubUrl)){
      m3uContent += `#EXTVLCOPT:sub-file=${absSubUrl.trim()}\n`;
    }
    m3uContent += `${absStreamUrl}\n`;
    const blob = new Blob([m3uContent], { type: 'audio/x-mpegurl' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${cleanTitle.replace(/[^a-zA-Z0-9_\-\s]/g, '').trim() || 'video'}.m3u`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2500);
    showToast("Descargando archivo .m3u (abrir con VLC o tu reproductor)");
  }

  function copyToClipboard(text, msg = "Enlace copiado al portapapeles"){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => fallbackCopy(text, msg));
    } else {
      fallbackCopy(text, msg);
    }
  }

  function fallbackCopy(text, msg){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast(msg);
    } catch(e){
      showToast("No se pudo copiar el enlace", true);
    }
    ta.remove();
  }

  /* ============ reproductor (HTTP & WebTorrent) ============ */
  function openPlayerForMovie(itemId){
    const item = findItem(itemId);
    if(!item || !item.torrent) return;
    openPlayer(item.torrent, item.title, item.subtitle);

  function openPlayerForEpisode(itemId, epId){

    const ep = findEpisode(itemId, epId);
    if(!item || !ep) return;
    openPlayer(ep.torrent, `${item.title} · S${ep.season}E${ep.episode}`, ep.subtitle, { itemId, epId });
  }

          <div class="player-buffer-item" id="playerBufCurrent" style="display:none;">

            <span class="player-buf-pct" id="playerBufCurrentPct">0%</span>

            <span class="player-buf-pct" id="playerBufNextPct">0%</span>

              Buscando peers WebTorrent…
              <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            </div>
          `}
        </div>
      </div>`;

    const overlay = document.getElementById("playerOverlay");

    // Configuración y alternancia de tamaño de subtítulos
    const SUB_SIZES = [
      { id: 'normal', label: 'Normal' },
      { id: 'large', label: 'Grande' },
      { id: 'xlarge', label: 'Extra (+100%)' },
      { id: 'huge', label: 'Enorme' }
    ];
    let currentSubSize = localStorage.getItem("marquesina_sub_size") || "xlarge";
    const applySubSize = (sizeId) => {
      SUB_SIZES.forEach(s => overlay.classList.remove(`sub-size-${s.id}`));
      overlay.classList.add(`sub-size-${sizeId}`);
      const lbl = document.getElementById("subSizeLabel");
      const found = SUB_SIZES.find(s => s.id === sizeId) || SUB_SIZES[2];
      if(lbl) lbl.textContent = found.label;
    };
    applySubSize(currentSubSize);

    const btnSubSize = document.getElementById("playerBtnSubSize");
    if(btnSubSize){
      btnSubSize.addEventListener('click', () => {
        const idx = SUB_SIZES.findIndex(s => s.id === currentSubSize);
        const nextIdx = (idx + 1) % SUB_SIZES.length;
        currentSubSize = SUB_SIZES[nextIdx].id;
        localStorage.setItem("marquesina_sub_size", currentSubSize);
        applySubSize(currentSubSize);
        showToast(`Tamaño de subtítulos: ${SUB_SIZES[nextIdx].label}`);
      });
    }

    document.getElementById("playerClose").addEventListener('click', closePlayer);
    document.getElementById("playerBtnCopy").addEventListener('click', () => copyToClipboard(streamUri));
    document.getElementById("playerBtnVlc").addEventListener('click', () => launchInExternalPlayer(streamUri, label, initialSubtitle));

    // Carga de subtítulos vía selector de archivo
    const subFileInput = document.getElementById("playerSubFile");
    document.getElementById("playerBtnSub").addEventListener('click', () => {

    subFileInput.addEventListener('change', (e) => {

      if(file) loadSubtitleFromFile(file);
      e.target.value = "";
    });

    overlay.addEventListener('dragover', (e) => {
      e.preventDefault();
      overlay.classList.add('dragover');
    });
    overlay.addEventListener('dragleave', (e) => {
      if(!overlay.contains(e.relatedTarget)){
        overlay.classList.remove('dragover');
      }
    });
    overlay.addEventListener('drop', (e) => {
      e.preventDefault();
      overlay.classList.remove('dragover');
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if(file && /\.(srt|vtt)$/i.test(file.name)){
        loadSubtitleFromFile(file);
      } else if(file){
        showToast("El archivo de subtítulo debe ser .srt o .vtt", true);
      }
    });

    function loadSubtitleFromFile(file){
      const reader = new FileReader();
      reader.onload = (ev) => {
        const buffer = ev.target.result;
        const text = decodeSubtitleText(buffer);
        const videoEl = document.getElementById("playerVideo");
        if(videoEl){
          attachSubtitleToVideo(videoEl, text, file.name.replace(/\.[^/.]+$/, ""), true);
        } else {
          showToast("Aguardá a que el reproductor inicie...", true);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    cleanupPlayback();

    if(isHttp){
      playHttpStream(streamUri, label, initialSubtitle, context);
    } else {
      playWebTorrentStream(streamUri, label, initialSubtitle, context);
    }
  }

  function playHttpStream(streamUri, label, initialSubtitle, context = null){
    const body = document.getElementById("playerBody");
    if(!body) return;

    const cleanUrl = sanitizeStreamUrlForBrowser(streamUri);

    body.innerHTML = `
      <video id="playerVideo" controls autoplay playsinline style="display:none;">
        <track kind="subtitles" label="Español" srclang="es" default>
      </video>
      <div class="player-status" id="playerLoadingStatus">
        Conectando con el servidor de streaming…
      </div>`;

    const videoEl = document.getElementById("playerVideo");
    const loadingEl = document.getElementById("playerLoadingStatus");

    // Iniciar carga del subtítulo de inmediato para que esté disponible en cuanto el video comience
    if(initialSubtitle){
      attachSubtitleToVideo(videoEl, initialSubtitle, "Subtítulo");
    }

    let hasDisplayed = false;
    function revealVideo(){
      if(!hasDisplayed && videoEl){
        hasDisplayed = true;
        videoEl.style.display = 'block';
        if(loadingEl && loadingEl.parentNode){
          loadingEl.parentNode.removeChild(loadingEl);
        }
        // En Firefox y Chrome, forzar modo showing al revelarse el video
        if(videoEl.textTracks){
          for(let i = 0; i < videoEl.textTracks.length; i++){
            videoEl.textTracks[i].mode = 'showing';
          }
        }
      }
    }

    videoEl.addEventListener('loadedmetadata', revealVideo);
    videoEl.addEventListener('loadeddata', revealVideo);
    videoEl.addEventListener('canplay', revealVideo);
    videoEl.addEventListener('playing', revealVideo);

    // Seguimiento de episodios vistos y auto-reproducción
    let markedWatched = false;
    let autoPlayCancelled = false;
    let prefetchDone = false;
    let nextEpisode = null;

    if(context && context.itemId && context.epId){
      nextEpisode = findNextEpisode(context.itemId, context.epId);
    }

    // ── Prebuffer + polling de progreso ───────────────────────────────────
    // 1. Prebuffer del siguiente episodio al arrancar el actual
    if(nextEpisode && nextEpisode.torrent){
      triggerPrebuffer(nextEpisode.torrent, `S${nextEpisode.season}E${nextEpisode.episode} (siguiente)`);
    }

    // 2. Helper para actualizar el panel de buffer en el reproductor
    function updatePlayerBufUI(slot, data) {
      // slot = 'current' | 'next'
      const panel = document.getElementById('playerBufferPanel');
      const row   = document.getElementById(`playerBuf${slot === 'current' ? 'Current' : 'Next'}`);
      const fill  = document.getElementById(`playerBuf${slot === 'current' ? 'Current' : 'Next'}Fill`);
      const pct   = document.getElementById(`playerBuf${slot === 'current' ? 'Current' : 'Next'}Pct`);
      const spd   = document.getElementById(`playerBuf${slot === 'current' ? 'Current' : 'Next'}Spd`);
      if(!row) return;
      const done = data.percent >= 100;
      row.style.display = 'flex';
      if(panel) panel.style.display = 'flex';
      if(fill){ fill.style.width = data.percent + '%'; fill.classList.toggle('done', done); }
      if(pct){ pct.textContent = done ? '✓' : data.percent + '%'; pct.classList.toggle('done', done); }
      if(spd){ spd.textContent = done ? '' : (data.speedKBps > 0 ? `${data.speedKBps} KB/s` : 'Conectando…'); }
      if(done){ setTimeout(() => { if(row) row.style.display='none'; const p = document.getElementById('playerBufferPanel'); if(p && !p.querySelector('[style*="flex"]')) p.style.display='none'; }, 3000); }
    }

    // 3. Arrancar polling de progreso cada 2.5 segundos
    if(progressPollingInterval) clearInterval(progressPollingInterval);
    const currentInfo = parseTorrentStreamUrl(streamUri);
    const nextInfo    = nextEpisode ? parseTorrentStreamUrl(nextEpisode.torrent || '') : null;

    if(currentInfo || nextInfo){
      const poll = () => {
        if(currentInfo){
          fetch(`${API_ORIGIN()}/api/torrent/progress?magnet=${encodeURIComponent(currentInfo.magnet)}&fileIndex=${currentInfo.fileIndex}`)
            .then(r => r.json())
            .then(d => {
              torrentProgress.set(`${currentInfo.magnet}::${currentInfo.fileIndex}`, d);
              updatePlayerBufUI('current', d);
              applyTorrentProgress();
            }).catch(() => {});
        }
        if(nextInfo){
          fetch(`${API_ORIGIN()}/api/torrent/progress?magnet=${encodeURIComponent(nextInfo.magnet)}&fileIndex=${nextInfo.fileIndex}`)
            .then(r => r.json())
            .then(d => {
              torrentProgress.set(`${nextInfo.magnet}::${nextInfo.fileIndex}`, d);
              updatePlayerBufUI('next', d);
              applyTorrentProgress();
            }).catch(() => {});
        }
      };
      poll(); // primera llamada inmediata
      progressPollingInterval = setInterval(poll, 2500);
    }
    // ─────────────────────────────────────────────────────────────────────

    videoEl.addEventListener('timeupdate', () => {
      if(!videoEl.duration || isNaN(videoEl.duration)) return;

      // 1. Marcar como visto al superar el 90%
      if(context && !markedWatched && (videoEl.currentTime / videoEl.duration >= 0.90)){
        markedWatched = true;
        toggleWatched(context.itemId, context.epId, true);
      }

      // 2. Pre-fetch y notificación en los últimos 10 segundos
      if(context && nextEpisode && !autoPlayCancelled){
        const remaining = videoEl.duration - videoEl.currentTime;
        if(remaining <= 10 && remaining > 0){

          // Pre-fetch del siguiente episodio para acelerar carga
          if(!prefetchDone){
            prefetchDone = true;
            if(nextEpisode.torrent && isHttpStream(nextEpisode.torrent)){
              const origin = (window.location.protocol.startsWith('http') && window.location.origin) ? window.location.origin : 'http://127.0.0.1:3333';
              const absNext = nextEpisode.torrent.startsWith('/') ? origin + nextEpisode.torrent : nextEpisode.torrent;
              fetch(absNext, { headers: { 'Range': 'bytes=0-1048576' } }).catch(() => {});
            }
          }

          // Mostrar u actualizar tarjeta flotante
          let card = document.getElementById("nextEpCard");
          const secs = Math.max(1, Math.ceil(remaining));
          if(!card){
            card = document.createElement("div");
            card.id = "nextEpCard";
            card.className = "next-ep-card";
            card.innerHTML = `
              <div class="title">Siguiente episodio en <span class="countdown-pill" id="nextCountdown">${secs}</span>s</div>
              <div class="ep-name">S${nextEpisode.season}E${nextEpisode.episode}</div>
              <div class="actions">
                <button class="btn btn-sm btn-ghost" id="nextEpCancel">Cancelar</button>
                <button class="btn btn-sm btn-primary" id="nextEpPlayNow">${icon('play')} Reproducir ya</button>
              </div>
            `;
            const overlay = document.getElementById("playerOverlay");
            if(overlay) overlay.appendChild(card);

            const cancelBtn = document.getElementById("nextEpCancel");
            if(cancelBtn){
              cancelBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                autoPlayCancelled = true;
                const c = document.getElementById("nextEpCard");
                if(c) c.remove();
              });
            }

            const playNowBtn = document.getElementById("nextEpPlayNow");
            if(playNowBtn){
              playNowBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const c = document.getElementById("nextEpCard");
                if(c) c.remove();
                openPlayerForEpisode(context.itemId, nextEpisode.id);
              });
            }
          } else {
            const countEl = document.getElementById("nextCountdown");
            if(countEl) countEl.textContent = secs;
          }
        }
      }
    });

    videoEl.addEventListener('ended', () => {
      if(context && !markedWatched){
        markedWatched = true;
        toggleWatched(context.itemId, context.epId, true);
      }
      if(context && nextEpisode && !autoPlayCancelled){
        const card = document.getElementById("nextEpCard");
        if(card) card.remove();
        openPlayerForEpisode(context.itemId, nextEpisode.id);
      }
    });

    let triedOriginal = false;
    videoEl.addEventListener('error', () => {
      console.warn("Error en elemento video HTML5:", videoEl.error);
      if(!triedOriginal && cleanUrl !== streamUri){
        triedOriginal = true;
        console.log("Probando enlace original con credenciales...");
        videoEl.src = streamUri;
        videoEl.load();
        return;
      }
      showHttpFallbackUI(streamUri, label, initialSubtitle);
    });

    videoEl.src = cleanUrl;
    videoEl.load();
    const playPromise = videoEl.play();
    if(playPromise !== undefined){
      playPromise.catch(err => {
        console.log("Autoplay en espera de interacción o bloqueado por el navegador:", err);
      });
    }
  }

  function showHttpFallbackUI(streamUri, label, initialSubtitle){
    const body = document.getElementById("playerBody");
    if(!body) return;
    body.innerHTML = `
      <div class="player-error-box">
        <h3>No se pudo reproducir en el navegador</h3>
        <p>
          El navegador no pudo reproducir el stream directamente. Esto suele ocurrir si el video está en un contenedor o códec no soportado nativamente (como <strong>MKV</strong>, audio <strong>AC3 / EAC3 / DTS</strong>), o si el servidor local de torrent aún no está en ejecución.
        </p>
        <p style="font-size:0.82rem; color:var(--amber);">
          Podés abrirlo al instante en <strong>VLC</strong>, <strong>PotPlayer</strong> o <strong>MPV</strong> sin problemas de códecs:
        </p>
        <div class="player-btn-group">
          <button class="btn btn-primary" id="fallbackVlcBtn">${icon('external')} Reproducir en VLC (.m3u)</button>
          <button class="btn btn-ghost" id="fallbackCopyBtn">${icon('copy')} Copiar Stream URL</button>
        </div>
      </div>
    `;
    document.getElementById("fallbackVlcBtn").addEventListener('click', () => launchInExternalPlayer(streamUri, label, initialSubtitle));
    document.getElementById("fallbackCopyBtn").addEventListener('click', () => copyToClipboard(streamUri));
  }

  function playWebTorrentStream(magnetUri, label, initialSubtitle, context = null){
    if(typeof WebTorrent === 'undefined'){
      showToast("No se pudo cargar WebTorrent (revisá tu conexión a internet)", true);
      return;
    }

    torrentClient = new WebTorrent();

    torrentClient.on('error', (err) => {
      console.error(err);
      showToast("Error de WebTorrent: " + (err.message || err), true);
    });

    try {
      torrentClient.add(magnetUri, (torrent) => {
        activeTorrent = torrent;
        const file = torrent.files.slice().sort((a,b)=>b.length-a.length)
          .find(f => /\.(mp4|webm|mkv|mov|m4v|ogv)$/i.test(f.name)) || torrent.files[0];

        if(!file){
          showToast("El torrent no tiene archivos de video reconocibles", true);
          return;
        }

        const body = document.getElementById("playerBody");
        body.innerHTML = `<video id="playerVideo" controls autoplay playsinline><track kind="subtitles" label="Español" srclang="es" default></video>`;
        const videoEl = document.getElementById("playerVideo");
        file.renderTo(videoEl, { autoplay: true }, (err) => {
          if(err) {
            showToast("No se pudo renderizar el archivo: " + err.message, true);
          } else {
            if(initialSubtitle){
              attachSubtitleToVideo(videoEl, initialSubtitle, "Subtítulo");
            } else {
              // Si no se configuró subtítulo manual, buscar si el mismo torrent incluye uno
              const autoSub = torrent.files.find(f => /\.(srt|vtt)$/i.test(f.name));
              if(autoSub){
                autoSub.getBuffer((subErr, buffer) => {
                  if(!subErr && buffer){
                    const text = decodeSubtitleText(buffer);
                    attachSubtitleToVideo(videoEl, text, autoSub.name.replace(/\.[^/.]+$/, ""), true);
                  }
                });
              }
            }
          }
        });

        // Eventos para marcar visto si WebTorrent
        if(context && context.itemId && context.epId){
          let marked = false;
          videoEl.addEventListener('timeupdate', () => {
            if(!marked && videoEl.duration && (videoEl.currentTime / videoEl.duration >= 0.90)){
              marked = true;
              toggleWatched(context.itemId, context.epId, true);
            }
          });
          videoEl.addEventListener('ended', () => {
            if(!marked){
              marked = true;
              toggleWatched(context.itemId, context.epId, true);
            }
          });
        }

        torrent.on('download', () => updateProgress(torrent));
        updateProgress(torrent);
      });
    } catch(err){
      console.error(err);
      showToast("Error al procesar el enlace magnet: " + err.message, true);
    }
  }

  function updateProgress(torrent){
    const fill = document.getElementById("progressFill");
    const status = document.getElementById("playerStatus");
    if(!fill) return;
    const pct = Math.round((torrent.progress || 0) * 100);
    fill.style.width = pct + "%";
    if(status && document.getElementById("playerVideo") === null){
      status.firstChild.textContent = `Descargando… ${pct}% · ${torrent.numPeers} peer(s)`;
    }
  }

  function cleanupPlayback(){
    document.body.classList.remove('player-open');
    const nextCard = document.getElementById("nextEpCard");
    if(nextCard) nextCard.remove();
    const videoEl = document.getElementById("playerVideo");
    if(videoEl){
      try {
        videoEl.pause();
        videoEl.removeAttribute('src');
        videoEl.load();
      } catch(e){}
    }
    if(activeSubtitleBlobUrl){
      try{ URL.revokeObjectURL(activeSubtitleBlobUrl); }catch(e){}
      activeSubtitleBlobUrl = null;
    }
    if(activeTorrent){
      try{ activeTorrent.destroy(); }catch(e){}
      activeTorrent = null;
    }
    if(torrentClient){
      try{ torrentClient.destroy(); }catch(e){}
      torrentClient = null;
    }
    // Detener el polling de progreso de buffer al cerrar el reproductor
    if(progressPollingInterval){
      clearInterval(progressPollingInterval);
      progressPollingInterval = null;
    }
  }

  function closePlayer(){
    document.body.classList.remove('player-open');
    cleanupPlayback();
    document.getElementById("playerRoot").innerHTML = "";
  }

  window.addEventListener('beforeunload', cleanupPlayback);

  /* ============ import / export ============ */
  function exportLibrary(){
    const blob = new Blob([JSON.stringify(library, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `marquesina-biblioteca-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast("Biblioteca exportada");
  }

  function importLibraryFromFile(file){
    const reader = new FileReader();
    reader.onload = (e) => {
      let parsed;
      try{
        parsed = JSON.parse(e.target.result);
      }catch(err){
        showToast("El archivo no es un JSON válido", true);
        return;
      }
      if(!Array.isArray(parsed)){
        showToast("El JSON debe ser un array de títulos", true);
        return;
      }
      const normalized = normalizeImported(parsed);
      const replace = confirm(
        `Se encontraron ${normalized.length} título(s) en el archivo.\n\nAceptar = reemplazar toda tu biblioteca actual.\nCancelar = combinar con la biblioteca existente.`
      );
      if(replace){
        library = normalized;
      } else {
        normalized.forEach(it => library.push(it));
      }
      saveLibrary();
      expandedId = null;
      render();
      showToast("Importación completada");
    };
    reader.readAsText(file);
  }

  // Acepta tanto el formato agrupado (type/episodes) como el formato plano
  // de ejemplo (title/season/episode/torrent repetido por episodio).
  function normalizeImported(raw){
    const looksFlat = raw.length && raw[0] && raw[0].season !== undefined && raw[0].type === undefined;
    if(!looksFlat){
      return raw.map(it => ({
        id: it.id || uid(),
        type: it.type === 'movie' ? 'movie' : 'series',
        title: it.title || 'Sin título',
        poster: it.poster || '',
        torrent: it.torrent || '',
        subtitle: it.subtitle || '',
        episodes: Array.isArray(it.episodes) ? it.episodes.map(ep => ({
          id: ep.id || uid(),
          season: Number(ep.season) || 1,
          episode: Number(ep.episode) || 1,
          torrent: ep.torrent || '',
          subtitle: ep.subtitle || '',
          rawTorrent: ep.rawTorrent || '',
          fileIndex: ep.fileIndex !== undefined ? ep.fileIndex : null,
          subFileIndex: ep.subFileIndex !== undefined ? ep.subFileIndex : null,
          watched: !!ep.watched
        })) : []
      }));
    }
    // formato plano -> agrupar por título
    const grouped = {};
    raw.forEach(row => {
      const key = row.title || 'Sin título';
      if(!grouped[key]){
        grouped[key] = { id: uid(), type: 'series', title: key, poster: row.poster || '', episodes: [] };
      }
      grouped[key].episodes.push({
        id: uid(),
        season: Number(row.season) || 1,
        episode: Number(row.episode) || 1,
        torrent: row.torrent || '',
        subtitle: row.subtitle || '',
        watched: !!row.watched
      });
    });
    return Object.values(grouped);
  }

  /* ============ listeners globales ============ */
  document.getElementById("btnAdd").addEventListener('click', () => openItemModal(null));
  document.getElementById("btnExport").addEventListener('click', exportLibrary);
  document.getElementById("btnImport").addEventListener('click', () => document.getElementById("importFile").click());
  document.getElementById("importFile").addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(file) importLibraryFromFile(file);
    e.target.value = "";
  });
  document.getElementById("searchInput").addEventListener('input', (e) => {
    searchTerm = e.target.value;
    render();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){
      if(document.getElementById("playerOverlay")) closePlayer();
      else if(document.getElementById("modalRoot").innerHTML) closeModal();
    }
  });

  render();
})();
</script>
